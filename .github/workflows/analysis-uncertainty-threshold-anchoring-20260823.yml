name: Uncertainty threshold, anchoring, and worker-type audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - tools/paper_a_manhattan/full_uncertainty/analyze_threshold_anchoring_worker_types_20260823.py.xz.b64.part*
      - tools/paper_a_manhattan/full_uncertainty/analyze_threshold_anchoring_worker_types_20260823.py
      - tools/paper_a_manhattan/full_uncertainty/patch_analysis_source_20260823.py
      - .github/workflows/analysis-uncertainty-threshold-anchoring-20260823.yml
  push:
    branches:
      - analysis/uncertainty-threshold-anchoring-worker-types-20260823
    paths:
      - tools/paper_a_manhattan/full_uncertainty/analyze_threshold_anchoring_worker_types_20260823.py.xz.b64.part*
      - tools/paper_a_manhattan/full_uncertainty/analyze_threshold_anchoring_worker_types_20260823.py
      - tools/paper_a_manhattan/full_uncertainty/patch_analysis_source_20260823.py
      - .github/workflows/analysis-uncertainty-threshold-anchoring-20260823.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: analysis/uncertainty-threshold-anchoring-worker-types-20260823
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn matplotlib shapely

      - name: Materialize and validate analysis source
        run: |
          if compgen -G 'tools/paper_a_manhattan/full_uncertainty/analyze_threshold_anchoring_worker_types_20260823.py.xz.b64.part*' > /dev/null; then
            cat tools/paper_a_manhattan/full_uncertainty/analyze_threshold_anchoring_worker_types_20260823.py.xz.b64.part* \
              | base64 --decode \
              | xz --decompress \
              > tools/paper_a_manhattan/full_uncertainty/analyze_threshold_anchoring_worker_types_20260823.py
          fi
          python tools/paper_a_manhattan/full_uncertainty/patch_analysis_source_20260823.py
          rm -f tools/paper_a_manhattan/full_uncertainty/analyze_threshold_anchoring_worker_types_20260823.py.xz.b64.part*
          python -m py_compile tools/paper_a_manhattan/full_uncertainty/analyze_threshold_anchoring_worker_types_20260823.py

      - name: Run independent re-analysis
        env:
          PREFIX_REPLICATES: '100'
          BOOTSTRAP_REPLICATES: '4000'
          SPLIT_REPEATS: '300'
          PYTHONPATH: .
        run: |
          python tools/paper_a_manhattan/full_uncertainty/analyze_threshold_anchoring_worker_types_20260823.py

      - name: Commit reproducible source and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            tools/paper_a_manhattan/full_uncertainty/analyze_threshold_anchoring_worker_types_20260823.py \
            tools/paper_a_manhattan/full_uncertainty/analyze_threshold_anchoring_worker_types_20260823.py.xz.b64.part* \
            tools/paper_a_manhattan/full_uncertainty/patch_analysis_source_20260823.py \
            analysis_results/uncertainty_threshold_anchoring_worker_types_20260823
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Materialize threshold anchoring and worker-type audit [skip ci]"
            git push
          fi

      - name: Upload result package
        uses: actions/upload-artifact@v4
        with:
          name: uncertainty-threshold-anchoring-worker-types-20260823
          path: analysis_results/uncertainty_threshold_anchoring_worker_types_20260823
          if-no-files-found: error
