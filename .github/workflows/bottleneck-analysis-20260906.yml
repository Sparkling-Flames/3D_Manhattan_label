name: Bottleneck models 20260906
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/bottleneck-analysis-20260906.yml]
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /lib/
            /config/
            /docs/
            /export_label/
            /import_json/
            /active_logs/
            /analysis_results/**/*.csv
            /analysis_results/**/*.json
            /analysis_results/**/*.jsonl
            /analysis_results/**/*.txt
            /analysis_results/**/*.md
            /.github/workflows/bottleneck-analysis-20260906.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy pandas scipy scikit-learn shapely
      - name: Materialize audited analysis source
        env:
          SOURCE_ZLIB_BASE64: 
        run: |
          python - <<'PY'
          import os,zlib,base64,hashlib,pathlib
          source=zlib.decompress(base64.b64decode(os.environ['SOURCE_ZLIB_BASE64']))
          assert hashlib.sha256(source).hexdigest()=='1ba39e656c32cf9cb4ed3e584e2c40723d55b401c22549eff653a45a28b2dc08'
          p=pathlib.Path('tools/thesis_main/analysis/bottleneck_models_20260906.py')
          p.write_bytes(source)
          compile(source,str(p),'exec')
          PY
      - name: Run analysis
        run: |
          python -u tools/thesis_main/analysis/bottleneck_models_20260906.py
          python - <<'PY'
          import json,platform,subprocess,importlib.metadata,pathlib
          out=pathlib.Path('analysis_results/bottleneck_reanalysis_20260906_v1')
          (out/'EXECUTION.json').write_text(json.dumps({'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'python':platform.python_version(),'packages':{p:importlib.metadata.version(p) for p in ['numpy','pandas','scipy','scikit-learn','shapely']}},indent=2))
          PY
      - name: Publish only requested code and results
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/bottleneck-analysis-20260906.yml')
          s=p.read_text(); a=s.index('      - name: Materialize audited analysis source\n'); b=s.index('      - name: Run analysis\n',a)
          p.write_text(s[:a]+s[b:])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- tools/thesis_main/analysis/bottleneck_models_20260906.py analysis_results/bottleneck_reanalysis_20260906_v1 .github/workflows/bottleneck-analysis-20260906.yml
          git commit -m 'Publish raw bottleneck reanalysis, models and exact finite-roster checks [skip ci]'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bottleneck-models-20260906
          path: |
            tools/thesis_main/analysis/bottleneck_models_20260906.py
            analysis_results/bottleneck_reanalysis_20260906_v1
          retention-days: 30
