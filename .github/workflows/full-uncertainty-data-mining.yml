name: Full uncertainty data mining

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/full-uncertainty-data-mining-20260821
    paths:
      - "tools/thesis_main/analysis/full_uncertainty_*.py"
      - "tools/thesis_main/analysis/materialize_full_uncertainty_data_mining.py"
      - ".github/workflows/full-uncertainty-data-mining.yml"
      - ".github/full-uncertainty-data-mining-trigger.txt"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          ref: analysis/full-uncertainty-data-mining-20260821
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy statsmodels matplotlib shapely tabulate pytest

      - name: Compile analysis modules
        run: |
          python -m py_compile \
            tools/thesis_main/analysis/full_uncertainty_common.py \
            tools/thesis_main/analysis/full_uncertainty_geometry.py \
            tools/thesis_main/analysis/materialize_full_uncertainty_data_mining.py

      - name: Run full uncertainty data mining
        run: |
          rm -rf analysis_results/full_uncertainty_data_mining_20260821_v1
          python -m tools.thesis_main.analysis.materialize_full_uncertainty_data_mining \
            --output-dir analysis_results/full_uncertainty_data_mining_20260821_v1

      - name: Commit reproducible outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- analysis_results/full_uncertainty_data_mining_20260821_v1
          if ! git diff --cached --quiet; then
            git commit -m "Materialize full uncertainty data-mining outputs"
            git push origin HEAD:analysis/full-uncertainty-data-mining-20260821
          fi

      - name: Package advisor evidence
        if: always()
        run: |
          if [ -d analysis_results/full_uncertainty_data_mining_20260821_v1 ]; then
            python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path("analysis_results/full_uncertainty_data_mining_20260821_v1")
          shutil.make_archive("full_uncertainty_data_mining_20260821_v1", "zip", root.parent, root.name)
          PY
          fi

      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-uncertainty-data-mining-20260821-v1
          path: |
            analysis_results/full_uncertainty_data_mining_20260821_v1
            full_uncertainty_data_mining_20260821_v1.zip
          if-no-files-found: warn
          retention-days: 30
