name: Historical difficulty A-E numerical analysis
on:
  push:
    branches: [codex/image-portrait-20260914]
    paths: [.github/workflows/history-difficulty-analysis-20260915.yml]
permissions:
  contents: write
jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/image-portrait-20260914
          fetch-depth: 1
          filter: blob:none
          lfs: false
          sparse-checkout: |
            tools
            lib/misc
            analysis_results/image_portrait_20260914_v1/cloud/history_difficulty_20260915_v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 shapely==2.0.7 pillow==10.4.0 opencv-python-headless==4.10.0.84 PyYAML==6.0.2
      - name: Read numeric layout feedback sources only
        run: |
          python - <<'PY'
          import pathlib,json,subprocess
          from tools.thesis_main.analysis.image_portrait.history_difficulty_v1_core import OUT,B,read
          ids=read(OUT/'inputs/historical_ids.json');pat=['/tools/','/lib/misc/','/lib/__init__.py','/'+str(OUT.relative_to(pathlib.Path.cwd()))+'/','/.gitignore','/.gitattributes']
          for model in ('hohonet','bilayout','ulayout'):
            for i in ids:
              for ext in (('.npz','.json') if model!='ulayout' else ('.geometry.npz',)):
                pat.append('/'+str((B/'models'/model/(i+ext)).relative_to(pathlib.Path.cwd())))
          subprocess.run(['git','sparse-checkout','set','--no-cone','--stdin'],input='\n'.join(pat)+'\n',text=True,check=True)
          PY
      - name: Correct missing dependency feedback without hiding failed attempt
        run: |
          python - <<'PY'
          import shutil,pandas as pd
          from tools.thesis_main.analysis.image_portrait.history_difficulty_v1_core import OUT,read,js
          from tools.thesis_main.analysis.image_portrait.history_difficulty_v1_models import feedback
          for name in ['model_feedback.csv','feedback_failures.csv']:
            old=OUT/'B'/name
            if old.exists():shutil.copy2(old,old.with_name('attempt2_missing_dependency_'+name))
          feedback(read(OUT/'inputs/historical_ids.json'))
          x=pd.read_csv(OUT/'B/model_feedback.csv');assert len(x)==205
          assert x[['count_hohonet','count_bi_enclosed','count_bi_extended','bi_head_geometry_gap']].notna().all().all()
          js('execution/FEEDBACK_CORRECTION_STATUS.json',{'status':'passed','images':205,'reason':'lib.misc was not in first sparse checkout; raw outputs never changed','failures_preserved':True})
          PY
      - name: Preserve corrected feedback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f analysis_results/image_portrait_20260914_v1/cloud/history_difficulty_20260915_v1/run_13859d59/B analysis_results/image_portrait_20260914_v1/cloud/history_difficulty_20260915_v1/run_13859d59/execution/FEEDBACK_CORRECTION_STATUS.json
          git commit -m 'research: complete actual Bi feedback after numeric dependency repair'
          git pull --rebase origin codex/image-portrait-20260914
          git push origin HEAD:codex/image-portrait-20260914
  analyses:
    needs: feedback
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        stage: [predict, associations, transfer, people]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/image-portrait-20260914
          fetch-depth: 1
          filter: blob:none
          lfs: false
          sparse-checkout: |
            tools
            lib/misc
            tests
            analysis_results/image_portrait_20260914_v1/cloud/history_difficulty_20260915_v1
            analysis_results/image_portrait_20260914_v1/cloud/pro_exploration/v2_convergence_e086b2b9/process
            analysis_results/image_portrait_20260914_v1/evaluation
            analysis_results/image_portrait_20260914_v1/human
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 shapely==2.0.7 pillow==10.4.0 opencv-python-headless==4.10.0.84 PyYAML==6.0.2 pytest==8.3.5
      - name: Run numerical analysis
        run: |
          python - <<'PY'
          import subprocess,sys,json,pathlib
          from tools.thesis_main.analysis.image_portrait.history_difficulty_v1_core import OUT
          stage='${{ matrix.stage }}';command=[sys.executable,'-m','tools.thesis_main.analysis.image_portrait.history_difficulty_v1_'+stage]
          with (OUT/'execution'/f'{stage}.log').open('w') as f:r=subprocess.run(command,stdout=f,stderr=subprocess.STDOUT)
          record={'stage':stage,'returncode':r.returncode,'command':command,'execution_sha':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()}
          (OUT/'execution'/f'{stage}_STATUS.json').write_text(json.dumps(record,indent=2))
          print(json.dumps(record));print((OUT/'execution'/f'{stage}.log').read_text()[-16000:])
          if stage=='associations':
            with (OUT/'execution/focused_tests.log').open('w') as f:t=subprocess.run([sys.executable,'-m','pytest','tests/test_history_difficulty_v1.py','-q'],stdout=f,stderr=subprocess.STDOUT)
            (OUT/'execution/FOCUSED_TEST_STATUS.json').write_text(json.dumps({'returncode':t.returncode}));print((OUT/'execution/focused_tests.log').read_text())
          PY
      - name: Preserve this route and its logs only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import subprocess
          from tools.thesis_main.analysis.image_portrait.history_difficulty_v1_core import OUT
          stage='${{ matrix.stage }}';paths={'predict':['prediction','C/training_only_layer_selection.csv'],'associations':['A','A_B','expert','execution/focused_tests.log','execution/FOCUSED_TEST_STATUS.json'],'transfer':['D'],'people':['E']}[stage]
          paths+=['execution/'+stage+'.log','execution/'+stage+'_STATUS.json'];paths=[str(OUT/p) for p in paths if (OUT/p).exists()]
          subprocess.run(['git','add','--sparse','-f',*paths],check=True)
          PY
          git commit -m 'research: preserve executed historical difficulty ${{ matrix.stage }} results' || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin codex/image-portrait-20260914 && git push origin HEAD:codex/image-portrait-20260914 && break
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-difficulty-${{ matrix.stage }}
          path: analysis_results/image_portrait_20260914_v1/cloud/history_difficulty_20260915_v1/run_13859d59
          retention-days: 30
      - name: Assert route actually executed successfully
        run: |
          python - <<'PY'
          import json
          from tools.thesis_main.analysis.image_portrait.history_difficulty_v1_core import OUT
          a=json.loads((OUT/'execution/${{ matrix.stage }}_STATUS.json').read_text());assert a['returncode']==0
          PY
