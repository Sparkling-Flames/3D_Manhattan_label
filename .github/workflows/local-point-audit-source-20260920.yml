name: Local point audit immutable source
on:
  push:
    branches: [research/local-point-audit-20260920]
    paths: [.github/workflows/local-point-audit-source-20260920.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 457081270c88b719f70d96a721ec0c810a76a2d1
          fetch-depth: 1
          sparse-checkout: |
            analysis_results/local_point_clustering_20260920
            analysis_results/worker_four_block_exploration_20260910_v1
            analysis_results/worker_reference_feasibility_20260909_v1
            analysis_results/pro_next_round_20260920
            docs/thesis_main
            tools/thesis_main/analysis
            tests
      - name: Collect unchanged research inputs
        shell: bash
        run: |
          mkdir -p export
          python - <<'PY'
          import pathlib, hashlib, json, subprocess, zipfile
          root=pathlib.Path('.')
          source='457081270c88b719f70d96a721ec0c810a76a2d1'
          paths=[]
          prefixes=['analysis_results/local_point_clustering_20260920','analysis_results/worker_four_block_exploration_20260910_v1','analysis_results/worker_reference_feasibility_20260909_v1','analysis_results/pro_next_round_20260920','docs/thesis_main','tools/thesis_main/analysis','tests']
          for prefix in prefixes:
              for p in sorted((root/prefix).rglob('*')):
                  if not p.is_file(): continue
                  if p.suffix.lower() in ['.py','.md','.json','.csv','.gz','.toml','.txt','.yml'] or p.name=='pro_local_points_20260920.zip': paths.append(p)
          rows=[]
          with zipfile.ZipFile('export/immutable_source.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              for p in paths:
                  data=p.read_bytes(); z.writestr(p.as_posix(),data)
                  rows.append({'path':p.as_posix(),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              z.writestr('SOURCE_TREE.txt',subprocess.check_output(['git','ls-tree','-rl',source]).decode())
              z.writestr('EXPORT_MANIFEST.json',json.dumps({'source_commit':source,'files':rows},ensure_ascii=False,indent=2))
          print('Unchanged source files:',len(paths))
          print('Archive SHA256:',hashlib.sha256(pathlib.Path('export/immutable_source.zip').read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pro-local-point-source-4570812
          path: export/immutable_source.zip
          if-no-files-found: error
          retention-days: 14
