name: Reviewer delta evidence 20260909
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/reviewer-delta-snapshot-20260909.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c091c3457130d225967e2b62b8e484c9205ab638
          fetch-depth: 3
          filter: blob:none
          lfs: false
          sparse-checkout: |
            tools/thesis_main
            tests
            docs
            analysis_results/building_holdout_exploration_20260908_v1
            analysis_results/confirmed_point_calculation_view_20260909_v1
            analysis_results/multibuilding_threshold_stability_20260909_v1
            analysis_results/semi_subtype_exploration_20260909_v1
            analysis_results/type_convergence_exploration_20260909_v1
            analysis_results/worker_reference_feasibility_20260909_v1
            analysis_results/uncertainty_decision_ready_20260908_v1/semantics
      - name: Archive exact changed source and numerical bytes
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          head='c091c3457130d225967e2b62b8e484c9205ab638';base='3a587422ccb3e1fdc715547300516ec4e3939d6d'
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==head
          names=subprocess.check_output(['git','diff','--name-only','-z',base,head]).decode().split('\0')
          allowed={'.py','.md','.json','.jsonl','.csv','.gz','.txt','.yaml','.yml'};records=[]
          with zipfile.ZipFile('/tmp/reviewer-delta-20260909.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=pathlib.Path(name)
                  if not name or p.suffix not in allowed:continue
                  assert p.is_file(),name
                  b=p.read_bytes();z.writestr(name,b);records.append({'path':name,'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)})
              z.writestr('DELTA_MANIFEST.json',json.dumps({'base':base,'head':head,'files':records},ensure_ascii=False,indent=2))
          print(len(records),'verified source entries',pathlib.Path('/tmp/reviewer-delta-20260909.zip').stat().st_size,'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer-delta-20260909
          path: /tmp/reviewer-delta-20260909.zip
          if-no-files-found: error
          retention-days: 14
