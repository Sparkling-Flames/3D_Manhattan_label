name: Publish verified worker and scene review 20260909
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/reviewer-worker-scene-20260909.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools/thesis_main/analysis/reviewer_20260909
            analysis_results/reviewer_worker_scene_20260909_v1
      - uses: actions/checkout@v4
        with:
          ref: a6ed34afdb4663c4bfb4b0c566369ba733b1266e
          path: baseline
          fetch-depth: 1
          filter: blob:none
          lfs: false
          sparse-checkout: |
            analysis_results/confirmed_point_calculation_view_20260909_v1
            analysis_results/worker_reference_feasibility_20260909_v1
            analysis_results/semi_subtype_exploration_20260909_v1
            analysis_results/uncertainty_cloud_inputs_20260906_v1/facts
            analysis_results/multibuilding_threshold_stability_20260909_v1/revised
            analysis_results/prescreen_closeout_final_gold_v2_20260701/raw_inputs
            export_label
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locally tested environment and validate plain source bytes
        run: |
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
          python - <<'PY'
          from pathlib import Path
          import hashlib
          src=Path('work/tools/thesis_main/analysis/reviewer_20260909')
          expected={'worker_audit.py':'e7fb93c7b90bde824fb8498137e2060b3f2e46ded2380a653b40d90efee63f2b','scene_audit.py':'0aa80df7b284116df4e8c2ef2dd3e496f751907de709a0cf42c2a476a9082b4d','supplement.py':'16c93ed7b42c4d5cad466f3f1b0193f897c9c0c6eff39e11988575eef34ce637'}
          for name,digest in expected.items():
              data=(src/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==digest,name
              compile(data,str(src/name),'exec')
          print('Plain source matches locally tested files')
          PY
      - name: Reproduce source audit, held-out prediction, scene bounds and actual-person replay
        run: |
          set -euo pipefail
          OUT=work/analysis_results/reviewer_worker_scene_20260909_v1
          mkdir -p "$OUT/results" "$OUT/code"
          cp work/tools/thesis_main/analysis/reviewer_20260909/*.py "$OUT/code/"
          python -u "$OUT/code/worker_audit.py" --repo baseline --out "$OUT/results" | tee "$OUT/results/worker_run.log"
          python -u "$OUT/code/scene_audit.py" --repo baseline --out "$OUT/results" | tee "$OUT/results/scene_run.log"
          python -u "$OUT/code/supplement.py" --repo baseline --out "$OUT/results" | tee "$OUT/results/supplement_run.log"
          python -m pip freeze > "$OUT/results/environment.txt"
      - name: Check numerical agreement, package ordinary results and verify ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          import pandas as pd
          out=Path('work/analysis_results/reviewer_worker_scene_20260909_v1');r=out/'results'
          w=json.loads((r/'WORKER_QA.json').read_text());s=json.loads((r/'SCENE_QA.json').read_text());q=json.loads((r/'SUPPLEMENT_QA.json').read_text())
          assert (w['raw_records_checked'],w['raw_exports'],w['scored_unassisted'],w['semi_rows'])==(2501,18,1484,574)
          assert (s['window_nodes_reproduced'],s['selected_transfer_folds_reproduced'])==(10928,1344)
          assert (q['coarse_recipe_complete_images'],q['coarse_recipe_rows'])==(41,59040)
          m=pd.read_csv(r/'manual_lobo_summary.csv');v=m[(m.cohort=='current20')&(m.reference_set=='all_accepted_references')&(m.cap==30)].iloc[0]
          assert abs(v.continuous_building_gain-.0338353543025)<1e-8
          e=pd.read_csv(r/'semi_revised_summary.csv');v=e[(e.cohort=='current20')&(e.pool=='without_synthetic')&(e.cap==30)&(e.outcome=='edit')].iloc[0]
          assert abs(v.layer_vs_manual_quadratic_gain-.114023)<2e-6
          a=pd.read_csv(r/'coarse_recipe_summary.csv');v=a[(a.k==6)&(a.recipe=='A')].iloc[0]
          assert abs(v.medoid_reference_OSPA30-3.748736)<2e-6
          (out/'requirements.txt').write_text('numpy==2.3.5\npandas==2.2.3\nscipy==1.17.0\nscikit-learn==1.8.0\n')
          (out/'REPRODUCTION.md').write_text('Read README_ZH.md. Three plain-source scripts are in code/. Run worker_audit.py, scene_audit.py, then supplement.py with --repo pointing to the pinned baseline and --out results. Source-level recreation needs the repository; private raw exports and advisor messages are not copied into this package. Derived row-level numerical outputs and source hashes are included. The interval bounds are not confidence intervals; bootstrap diagnostics condition on observed workers.\n')
          records=[]
          for p in sorted(out.rglob('*')):
              if not p.is_file() or '__pycache__' in p.parts or p.name in {'DELIVERY_MANIFEST.json','reviewer_20260909_core.zip','reviewer_20260909_core.zip.sha256'}: continue
              records.append({'path':str(p.relative_to(out)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest={'baseline':'a6ed34afdb4663c4bfb4b0c566369ba733b1266e','file_count':len(records),'files':records,'plain_source_verified':True,'raw_originals_modified':False,'raw_exports_redistributed':False,'advisor_transcript_redistributed':False,'numerical_crosscheck_passed':True}
          (out/'DELIVERY_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          zipfile_path=out/'reviewer_20260909_core.zip'
          with zipfile.ZipFile(zipfile_path,'w',zipfile.ZIP_DEFLATED) as z:
              for row in records:z.write(out/row['path'],row['path'])
              z.write(out/'DELIVERY_MANIFEST.json','DELIVERY_MANIFEST.json')
          with zipfile.ZipFile(zipfile_path) as z:
              assert z.testzip() is None
              for row in records:assert hashlib.sha256(z.read(row['path'])).hexdigest()==row['sha256'],row['path']
          digest=hashlib.sha256(zipfile_path.read_bytes()).hexdigest();(out/'reviewer_20260909_core.zip.sha256').write_text(digest+'  reviewer_20260909_core.zip\n')
          print('PACKAGED',len(records),'files',zipfile_path.stat().st_size,'bytes',digest)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewer-worker-scene-20260909
          path: work/analysis_results/reviewer_worker_scene_20260909_v1/
          retention-days: 14
          if-no-files-found: error
      - name: Publish ordinary files and verify bytes read back from main
        run: |
          set -euo pipefail
          cd work
          git config user.name 'Jiawei Zhang'
          git config user.email '150024234+Sparkling-Flames@users.noreply.github.com'
          git add -f analysis_results/reviewer_worker_scene_20260909_v1
          git commit -m 'Publish verified worker and same-building audit: actual row-level results, source, manifest and ZIP'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          out=Path('analysis_results/reviewer_worker_scene_20260909_v1');m=json.loads((out/'DELIVERY_MANIFEST.json').read_text())
          for r in m['files']:
              data=subprocess.check_output(['git','show','origin/main:'+str(out/r['path'])])
              assert hashlib.sha256(data).hexdigest()==r['sha256'],r['path']
          for name in ['DELIVERY_MANIFEST.json','reviewer_20260909_core.zip','reviewer_20260909_core.zip.sha256']:
              assert subprocess.check_output(['git','show','origin/main:'+str(out/name)])==(out/name).read_bytes(),name
          print('MAIN_READBACK_VERIFIED',len(m['files'])+3,subprocess.check_output(['git','rev-parse','origin/main']).decode().strip())
          PY
