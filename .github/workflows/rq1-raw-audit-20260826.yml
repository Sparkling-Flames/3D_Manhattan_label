name: RQ1 raw audit 20260826

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/rq1-raw-audit-20260826
    paths:
      - "tools/thesis_main/analysis/raw_rq1_audit_20260826.py"
      - "tools/thesis_main/analysis/raw_rq1_recompute_20260826.py"
      - ".github/workflows/rq1-raw-audit-20260826.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: analysis/rq1-raw-audit-20260826
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geometry dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy shapely

      - name: Run raw schema audit
        run: python tools/thesis_main/analysis/raw_rq1_audit_20260826.py

      - name: Run independent raw RQ1 recomputation
        run: python -m tools.thesis_main.analysis.raw_rq1_recompute_20260826

      - name: Commit audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- analysis_results/rq1_raw_audit_20260826 analysis_results/rq1_raw_recompute_20260826
          if ! git diff --cached --quiet; then
            git commit -m "Materialize independent raw RQ1 recomputation"
            git push origin HEAD:analysis/rq1-raw-audit-20260826
          fi

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: rq1-raw-audit-20260826
          path: |
            analysis_results/rq1_raw_audit_20260826
            analysis_results/rq1_raw_recompute_20260826
          if-no-files-found: error
          retention-days: 30
