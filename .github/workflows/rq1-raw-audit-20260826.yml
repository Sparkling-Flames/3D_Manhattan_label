name: RQ1 corrected raw audit 20260826

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/thesis_main/analysis/audit_rq1_corrections_20260826.py"
      - ".github/workflows/rq1-raw-audit-20260826.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geometry dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy shapely

      - name: Run correction audit
        run: python -m tools.thesis_main.analysis.audit_rq1_corrections_20260826

      - name: Commit correction outputs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- analysis_results/rq1_corrections_20260826
          if ! git diff --cached --quiet; then
            git commit -m "Materialize corrected RQ1 raw audit"
            git push origin HEAD:main
          fi

      - name: Upload correction audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: rq1-corrections-20260826
          path: analysis_results/rq1_corrections_20260826
          if-no-files-found: error
          retention-days: 30
