name: RQ1 raw audit 20260826

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/rq1-raw-audit-20260826
    paths:
      - "tools/thesis_main/analysis/raw_rq1_audit_20260826.py"
      - ".github/workflows/rq1-raw-audit-20260826.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: analysis/rq1-raw-audit-20260826
          fetch-depth: 0

      - name: Run standard-library raw audit
        run: python3 tools/thesis_main/analysis/raw_rq1_audit_20260826.py

      - name: Commit compact audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- analysis_results/rq1_raw_audit_20260826
          if ! git diff --cached --quiet; then
            git commit -m "Materialize independent raw RQ1 audit"
            git push origin HEAD:analysis/rq1-raw-audit-20260826
          fi

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: rq1-raw-audit-20260826
          path: analysis_results/rq1_raw_audit_20260826
          if-no-files-found: error
          retention-days: 30
