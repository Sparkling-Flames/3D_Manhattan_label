name: Topology preflight v4 audit

on:
  push:
    branches:
      - codex/paper
    paths:
      - tools/thesis_main/analysis/audit_topology_preflight_v4.py
      - .github/workflows/topology-preflight-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out paper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy shapely

      - name: Run append-only v4 audit
        run: |
          python tools/thesis_main/analysis/audit_topology_preflight_v4.py \
            --root "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/analysis_results/topology_sequential_preflight_20260818_v4_audit" \
            --replicates 1000

      - name: Commit materialized audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_results/topology_sequential_preflight_20260818_v4_audit
          git commit -m "analysis: materialize topology preflight v4 audit"
          git push origin HEAD:codex/paper
