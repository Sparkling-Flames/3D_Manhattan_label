name: Uncertainty v5 audit supplement

on:
  push:
    branches:
      - analysis/uncertainty-v5-audit-20260822
    paths:
      - tools/paper_a_manhattan/full_uncertainty/audit_v5_calculation_modes.py
      - .github/workflows/uncertainty-v5-audit-supplement.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependencies
        run: python -m pip install --upgrade pandas numpy scipy

      - name: Materialize audit supplement
        run: python -m tools.paper_a_manhattan.full_uncertainty.audit_v5_calculation_modes

      - name: Commit generated audit tables
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            analysis_results/full_uncertainty_data_mining_20260821_v5_audit_20260822/IMAGE_FEATURE_MULTIPLICITY_AUDIT.csv \
            analysis_results/full_uncertainty_data_mining_20260821_v5_audit_20260822/IMAGE_FEATURE_ALIAS_AUDIT.csv \
            analysis_results/full_uncertainty_data_mining_20260821_v5_audit_20260822/SEMI_OBSERVED_EFFECT_POWER_PROJECTION.csv \
            analysis_results/full_uncertainty_data_mining_20260821_v5_audit_20260822/SEMI_REQUIRED_SAMPLE_BY_EFFECT_AUDIT.csv \
            analysis_results/full_uncertainty_data_mining_20260821_v5_audit_20260822/QUALITY_RISK_TASK_BUILDING_CLUSTER_AUDIT.csv \
            analysis_results/full_uncertainty_data_mining_20260821_v5_audit_20260822/CALCULATION_MODE_AUDIT.csv
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Materialize v5 audit supplement tables"
          git push origin HEAD
