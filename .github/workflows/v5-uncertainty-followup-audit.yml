name: V5 uncertainty follow-up audit

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/v5-uncertainty-audit-followup-20260822
    paths:
      - "tools/paper_a_manhattan/full_uncertainty/audit_v5_followup.py"
      - ".github/workflows/v5-uncertainty-followup-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: analysis/v5-uncertainty-audit-followup-20260822
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy tabulate

      - name: Compile and run audit
        run: |
          python -m py_compile tools/paper_a_manhattan/full_uncertainty/audit_v5_followup.py
          rm -rf analysis_results/full_uncertainty_data_mining_20260821_v5_followup_audit
          python tools/paper_a_manhattan/full_uncertainty/audit_v5_followup.py \
            --output-dir analysis_results/full_uncertainty_data_mining_20260821_v5_followup_audit

      - name: Commit reproducible outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- analysis_results/full_uncertainty_data_mining_20260821_v5_followup_audit
          if ! git diff --cached --quiet; then
            git commit -m "Materialize clustered v5 uncertainty follow-up audit"
            git push origin HEAD:analysis/v5-uncertainty-audit-followup-20260822
          fi

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-uncertainty-followup-audit
          path: analysis_results/full_uncertainty_data_mining_20260821_v5_followup_audit
          if-no-files-found: warn
          retention-days: 30
