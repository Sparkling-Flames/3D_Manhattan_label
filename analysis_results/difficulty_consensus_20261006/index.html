<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>候选图片审查台 · 8图难度补标</title>
<style>
:root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#172b3a;background:#f2f5f7}*{box-sizing:border-box}body{margin:0}header{background:#152e40;color:white;padding:24px max(22px,calc((100vw - 1500px)/2))}header h1{font-size:25px;margin:0 0 12px}header p{margin:6px 0;line-height:1.65;font-size:14px;color:#dce7ef}.bar{position:sticky;top:0;z-index:8;background:#fff;box-shadow:0 2px 12px #22334420;padding:12px 22px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}button,select,input,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #b6c4ce;border-radius:5px;background:white;color:#173248}button{cursor:pointer}button:hover{background:#eaf3f8}label{font-size:13px}#stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}#stats strong{font-size:21px}#warning{font-size:13px;color:#9d3c20;white-space:pre-wrap;margin-top:6px}main{max-width:1500px;margin:auto;padding:22px}.group{border:1px solid #d3dfe7;border-radius:8px;background:white;margin-bottom:26px;padding:20px}.group h2{font-size:21px;margin:0 0 10px}.group p{font-size:14px;line-height:1.75;margin:5px 0}.reviewRisk{background:#fff4df;padding:10px;border-radius:4px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}.card{border:1px solid #c9d5df;border-radius:5px;overflow:hidden;background:#fafcfd}.head{padding:12px;display:flex;justify-content:space-between;font-size:16px;gap:10px}.pano{display:block;width:100%;aspect-ratio:2/1;background:#e5ecf1;object-fit:contain;cursor:zoom-in}.status{font-size:12px;padding:5px 12px;color:#546d7d;word-break:break-word}.meta{padding:10px 12px;font-size:13px;line-height:1.65}.meta p{font-size:13px;margin:4px 0}.pill{display:inline-block;padding:2px 6px;border-radius:4px;background:#e6edf3;margin:1px 3px 1px 0}.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:10px 0}.counts div{background:#eef3f7;padding:6px}.cost{border-collapse:collapse;width:100%;margin:8px 0}.cost th,.cost td{border:1px solid #d7e1e8;padding:5px;text-align:center;font-size:12px}.cost th{background:#e9f0f5}.edit{display:flex;gap:7px;flex-wrap:wrap;padding:10px 12px;background:#edf4f8}.edit select{font-size:12px;padding:6px;max-width:100%}.notes{width:100%;margin-top:5px;resize:vertical;min-height:50px}.small{font-size:12px;color:#587080}.links a{color:#24587d;margin-right:12px}details{margin-top:7px}summary{cursor:pointer}.empty{display:none}.legend{line-height:1.7;background:#fff;padding:16px;border-left:4px solid #6e8ba0;margin-bottom:18px}footer{font-size:12px;line-height:1.7;color:#5d7180;margin-top:26px}dialog{max-width:96vw;max-height:94vh;border:0;padding:12px;background:#fff;border-radius:8px}dialog img{width:min(1600px,92vw);height:auto}dialog::backdrop{background:#0009}@media(max-width:800px){.cards{grid-template-columns:1fr}.bar{position:relative}main{padding:12px}.group{padding:12px}.counts{grid-template-columns:repeat(2,1fr)}}

.pano-button{display:block;width:100%;padding:0;border:0;border-radius:0}.edit label{flex:1;min-width:150px}.edit select{display:block;width:100%;font-size:14px;margin-top:5px}.edit .note-label{flex-basis:100%}.single{grid-template-columns:1fr}.head{align-items:center}#saved{font-size:13px;color:#345b45}#zoomTitle{font-size:16px;margin:0}#zoom .head{position:sticky;top:0;background:white}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #227dc6;outline-offset:2px}
</style>
<header><h1>候选图片审查台 · 8图难度补标</h1><p>请按你的判断选择标注难度；可补一句原因。前7张用于补齐共同24人×10图面板，第8张为23人补充图。</p><p>OOS：房间结构难以用当前布局准确表达。门洞交界：相机位置造成范围歧义，房间本身仍可符合曼哈顿约束。两项分别填写，也可暂时留空。</p></header>
<div class="bar"><div class="controls"><input id="q" aria-label="搜索图片编号" placeholder="搜索图片编号" size="25"><select id="filter" aria-label="填写状态筛选"><option value="all">全部图片</option><option value="pending">难度未填写</option><option value="done">难度已填写</option></select><button id="layout">切换为单列大图</button><span id="stats" aria-live="polite"></span></div>
<div class="controls"><button id="export">导出我的难度标注</button><label>导入继续填写 <input id="import" type="file" accept="application/json,.json" style="width:220px"></label><span id="saved" role="status">填写后自动暂存；完成后请导出JSON。</span></div></div>
<main><div class="legend">点击图片可放大。难度选“简单／中等／困难／暂不能判断”，原因可不填。这里不预设难度对应哪一种人数曲线。</div><section id="cards" class="cards" aria-label="待标图片"></section><footer>沿用候选图片审查台。此次填写单独保存；导出后把JSON交回来即可。</footer></main>
<dialog id="zoom" aria-labelledby="zoomTitle"><div class="head"><h2 id="zoomTitle"></h2><button id="close">关闭大图</button></div><img id="zoomImg" alt="原图放大"></dialog>
<script id="source" type="application/json">{"schema": "difficulty_review_20261006_v1", "images": [{"image_code": "7y3sRwLe3Va-04", "image_id": "7y3sRwLe3Va_1410b021e1c14f529188eb026fbb369a", "manual_n": 24, "src": "../../data/mp3d_layout/test/img/7y3sRwLe3Va_1410b021e1c14f529188eb026fbb369a.png"}, {"image_code": "UwV83HsGsw3-09", "image_id": "UwV83HsGsw3_7482b1a2655e4655ae4ab58749f43f65", "manual_n": 24, "src": "../../data/mp3d_layout/test/img/UwV83HsGsw3_7482b1a2655e4655ae4ab58749f43f65.png"}, {"image_code": "q9vSo1VnCiC-02", "image_id": "q9vSo1VnCiC_2a8ef249ec0e4ad5bfe138a65f50964e", "manual_n": 24, "src": "../../data/mp3d_layout/test/img/q9vSo1VnCiC_2a8ef249ec0e4ad5bfe138a65f50964e.png"}, {"image_code": "q9vSo1VnCiC-32", "image_id": "q9vSo1VnCiC_e74e843601574864a14517f990c748a0", "manual_n": 24, "src": "../../data/mp3d_layout/test/img/q9vSo1VnCiC_e74e843601574864a14517f990c748a0.png"}, {"image_code": "rPc6DW4iMge-06", "image_id": "rPc6DW4iMge_186a32a1b7e34cb797731bfa78365db5", "manual_n": 24, "src": "../../data/mp3d_layout/test/img/rPc6DW4iMge_186a32a1b7e34cb797731bfa78365db5.png"}, {"image_code": "yqstnuAEVhm-32", "image_id": "yqstnuAEVhm_e650c19e3eb34cc0b98374e5a23d1f65", "manual_n": 24, "src": "../../data/mp3d_layout/test/img/yqstnuAEVhm_e650c19e3eb34cc0b98374e5a23d1f65.png"}, {"image_code": "yqstnuAEVhm-34", "image_id": "yqstnuAEVhm_e9b4d8e951cb4712b3905c8f4c4dabb5", "manual_n": 24, "src": "../../data/mp3d_layout/test/img/yqstnuAEVhm_e9b4d8e951cb4712b3905c8f4c4dabb5.png"}, {"image_code": "wc2JMjhGNzB-59", "image_id": "wc2JMjhGNzB_dc4a9f470b834de1983c7e605ff06b2e", "manual_n": 23, "src": "../../data/mp3d_layout/test/img/wc2JMjhGNzB_dc4a9f470b834de1983c7e605ff06b2e.png"}]}</script>
<script>
const D=JSON.parse(document.getElementById('source').textContent),KEY=D.schema;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const options={difficulty:['','简单','中等','困难','暂不能判断'],oos:['','是','否','不确定'],doorway:['','是','否','不确定']};
let state={};
const empty=()=>({difficulty:'',oos:'',doorway:'',note:'',updated_at:null});
const S=id=>state[id]||empty();
function validate(v){
 if(v.schema!==D.schema||!Array.isArray(v.decisions)||v.decisions.length!==D.images.length)throw Error('请使用本次8图导出文件');
 const next={};
 for(const r of v.decisions){
  const image=D.images.find(x=>x.image_id===r.image_id);
  if(!image||image.image_code!==r.image_code||Object.hasOwn(next,r.image_id))throw Error('图片编号不匹配或重复');
  if(Object.entries(options).some(([k,a])=>!a.includes(r[k]))||typeof r.note!=='string'||!(r.updated_at===null||typeof r.updated_at==='string'))throw Error('填写内容格式不匹配');
  next[r.image_id]={...Object.fromEntries(Object.keys(options).map(k=>[k,r[k]])),note:r.note,updated_at:r.updated_at};
 }
 return next;
}
function exportData(){return {schema:D.schema,exported_at:new Date().toISOString(),decisions:D.images.map(r=>({image_id:r.image_id,image_code:r.image_code,...S(r.image_id)}))};}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(exportData()));$('saved').textContent='已暂存到当前浏览器；完成后请导出JSON。';}catch(e){$('saved').textContent='浏览器暂存失败，请导出JSON保存。';}}
function stats(){$('stats').textContent=`难度已填写 ${D.images.filter(r=>S(r.image_id).difficulty).length} / ${D.images.length}`;}
function select(r,key,label){return `<label>${label}<select data-id="${esc(r.image_id)}" data-key="${key}">${options[key].map(v=>`<option value="${v}" ${S(r.image_id)[key]===v?'selected':''}>${v||'请选择（可留空）'}</option>`).join('')}</select></label>`;}
function render(){
 const q=$('q').value.trim().toLowerCase(),filter=$('filter').value;
 $('cards').innerHTML=D.images.filter(r=>(r.image_code+' '+r.image_id).toLowerCase().includes(q)&&(filter==='all'||Boolean(S(r.image_id).difficulty)===(filter==='done'))).map(r=>`<article class="card"><div class="head"><b>${esc(r.image_code)}</b><span class="small">Manual ${r.manual_n}人</span></div><button class="pano-button" data-zoom="${esc(r.image_id)}" aria-label="放大 ${esc(r.image_code)}"><img class="pano" src="${esc(r.src)}" alt="${esc(r.image_code)} 全景原图"></button><div class="edit">${select(r,'difficulty','标注难度')}${select(r,'oos','结构OOS（可选）')}${select(r,'doorway','门洞交界（可选）')}<label class="note-label">原因／备注（可选）<textarea class="notes" data-id="${esc(r.image_id)}" data-key="note" placeholder="可以简单说说哪里难标或有歧义">${esc(S(r.image_id).note)}</textarea></label></div></article>`).join('')||'<p>当前筛选无图片。</p>';
 stats();
}
try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));}catch(e){$('saved').textContent='未能读取暂存：'+e.message;}
$('cards').addEventListener('input',e=>{const {id,key}=e.target.dataset;if(!id||!key)return;state[id]={...S(id),[key]:e.target.value,updated_at:new Date().toISOString()};persist();stats();});
$('cards').addEventListener('click',e=>{const button=e.target.closest('[data-zoom]');if(!button)return;const r=D.images.find(x=>x.image_id===button.dataset.zoom);$('zoomTitle').textContent=r.image_code;$('zoomImg').src=r.src;$('zoom').showModal();});
$('close').onclick=()=>$('zoom').close();
$('q').oninput=render;$('filter').onchange=render;
$('layout').onclick=()=>{const single=$('cards').classList.toggle('single');$('layout').textContent=single?'切换为双列图片':'切换为单列大图';};
$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(exportData(),null,2)],{type:'application/json'}));a.download='8图标注难度_20261006.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('import').onchange=async e=>{try{if(!e.target.files.length)return;const next=validate(JSON.parse(await e.target.files[0].text()));if(Object.values(state).some(r=>r.updated_at)&&!confirm('用导入文件替换本页当前填写？未导出的内容请先导出。'))return;state=next;persist();render();$('saved').textContent='已导入并暂存。';}catch(err){alert('导入失败：'+err.message);}finally{e.target.value='';}};
render();
</script></html>
