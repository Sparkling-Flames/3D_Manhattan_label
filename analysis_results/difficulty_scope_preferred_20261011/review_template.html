<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>259图 · 固定范围后的难度复核</title>
<style>body{margin:0;background:#f2f4f7;color:#172535;font:16px/1.6 system-ui}header,main{max-width:1400px;margin:auto;padding:20px}header{background:#fff}h1{font-size:25px;margin:0}button,select,input,textarea{font:inherit;padding:7px;border:1px solid #bac5cf;border-radius:6px}button{cursor:pointer;background:white}button.active{background:#145d70;color:white}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.box{background:white;border-radius:10px;padding:16px;margin:12px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tag{display:inline-block;background:#e3eef1;margin-right:8px;padding:3px 8px;border-radius:6px}img{width:100%;display:block}small,.muted{color:#526574}a{color:#116779}pre{white-space:pre-wrap;font:14px/1.5 system-ui}textarea{width:95%;min-height:70px}svg{width:100%;height:210px;background:#f5f8fb}#pick{max-width:100%}@media(max-width:800px){.columns{grid-template-columns:1fr}}</style>
<header><h1>259图 · 固定范围后的难度复核</h1><p>先在已接受的候选范围中优先采用 H=0 的范围，再评结构与定位负担。你的任务是检查粗分类是否明显不合理，<b>无需重复确认已批准的范围</b>。</p><small>新范围仅底面已确认。H 是实墙底面几何量，不等于照片完全遮挡；玻璃和开放边界需另解释。OOS 与门洞独立保存，允许重叠。当前结论含 Codex 视觉判读，并非纯自动标签。</small><nav id="filters"></nav><label>查找图片 <input id="search" placeholder="图片编号"></label> <button id="export">导出我的复核</button> <span id="saved" aria-live="polite"></span></header>
<main><div class="box"><button id="prev">上一张</button> <select id="pick" aria-label="选择图片"></select> <button id="next">下一张</button> <span id="position"></span></div><section id="content"></section>
<div class="box"><b>我的复核（本地草稿，不自动改主表）</b><p><label>判断 <select id="grade"><option value="">未复核</option><option>认可建议</option><option>简单</option><option>中等</option><option>困难</option><option>待复核</option><option>特殊场景需单独讨论</option></select></label></p><label>说明 <textarea id="note" placeholder="例如：有局部遮挡，但角位仍易推断；或指出具体GT疑点"></textarea></label></div></main>
<script>
const DATA=__DATA__;const rows=DATA.records,KEY=DATA.version+':user_review';let drafts=JSON.parse(localStorage.getItem(KEY)||'{}'),filter='全部',visible=[],idx=0;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function matches(r,f){return f==='全部'||f==='OOS'&&r.scene.includes('oos')||f==='门洞'&&r.scene.includes('doorway')||f==='新旧范围'&&r.candidates.length>1||f==='已改档'&&r.current_class!==r.previous_scope_class||f==='待复核'&&r.current_class==='待复核'||r.current_class===f}
function makeFilters(){ $('filters').innerHTML=['全部','简单','中等','困难','待复核','OOS','门洞','新旧范围','已改档'].map(f=>`<button class="${f===filter?'active':''}" data-filter="${f}">${f} ${rows.filter(r=>matches(r,f)).length}</button>`).join('');$('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;refresh()})}
function refresh(){let q=$('search').value.trim().toLowerCase();visible=rows.filter(r=>matches(r,filter)&&r.image.toLowerCase().includes(q));idx=0;makeFilters();$('pick').innerHTML=visible.map((r,i)=>`<option value="${i}">${esc(r.image)} · ${esc(r.current_class)}</option>`).join('');show()}
function floor(c){let p=c.floor,xx=p.map(t=>t[0]).concat(0),zz=p.map(t=>t[1]).concat(0),loX=Math.min(...xx),loZ=Math.min(...zz),scale=170/Math.max(Math.max(...xx)-loX,Math.max(...zz)-loZ),xy=t=>[20+(t[0]-loX)*scale,20+(t[1]-loZ)*scale];return `<svg viewBox="0 0 250 210" role="img" aria-label="所选范围底面"> <polygon points="${p.map(t=>xy(t).join(',')).join(' ')}" fill="#d9edef" stroke="#15708c" stroke-width="2"/>${p.map((t,i)=>{let [x,y]=xy(t);return `<circle cx="${x}" cy="${y}" r="2"/><text x="${x+3}" y="${y-3}" font-size="9">${i+1}</text>`}).join('')}<circle cx="${xy([0,0])[0]}" cy="${xy([0,0])[1]}" r="4" fill="#cf5930"/></svg>`}
function opinion(r){if(!r)return '无该审核记录';return ['当时判断：'+(r.grade||'未填'),'当时建议档：'+(r.proposed_class||'未记录'),'范围意见：'+(r.scope||'未填'),'说明：'+(r.note||'无')].join('\n')}
function show(){let r=visible[idx];$('position').textContent=`${visible.length?idx+1:0} / ${visible.length}`;$('pick').value=idx;$('prev').disabled=idx===0;$('next').disabled=idx>=visible.length-1;$('grade').disabled=$('note').disabled=!r;if(!r){$('content').innerHTML='<p>没有符合条件的图片。</p>';return}
 let role=r.selected.role==='confirmed_scope'?'用户已确认范围':'当前选定GT范围';
 $('content').innerHTML=`<div class="box"><h2>${esc(r.image)}</h2><span class="tag">${esc(r.current_class)}</span><span class="tag">固定范围内：${esc(r.conditional_difficulty)}</span><span class="tag">${role}</span><p>底面点数 ${r.N_floor} · 转折数 ${r.N_turn} · 几何 H=${r.H} · 推断负担 ${esc(r.inference_burden)}</p><p><b>我的判断：</b>${esc(r.evidence)}</p>${r.question?`<p><b>具体待核：</b>${esc(r.question)}</p>`:''}<p class="muted">${esc(r.applicability_note)}</p><p>旧视觉类 ${esc(r.previous_visual_class)} → 上一轮 ${esc(r.previous_scope_class)} → 本轮 ${esc(r.current_class)}</p></div><div class="box"><img src="${esc(r.card)}" alt="${esc(r.image)} 当前范围角位"><p><a target="_blank" href="${esc('file:///'+r.photo.replaceAll('\\','/'))}">打开原始全景大图</a> · <a target="_blank" href="${esc(r.old_card)}">旧GT与人员图卡（只作对照，不参与本轮定档）</a>${r.scope_comparison?` · <a target="_blank" href="${esc(r.scope_comparison)}">新旧范围完整对照</a>`:''}</p></div><div class="columns">${r.candidates.map(c=>`<div class="box"><b>${c.role==='confirmed_scope'?'已确认替代范围':'原选定GT'}${c.target_id===r.target_version?' · 本轮采用':''}</b><p>N=${c.features.N_floor} / 转折=${c.features.N_turn} / H=${c.features.H}</p>${floor(c)}</div>`).join('')}</div><div class="columns"><div class="box"><b>你此前的审核</b><pre>${esc(opinion(r.previous_user_review))}</pre></div><div class="box"><b>另一位审核者</b><pre>${esc(opinion(r.external_review))}</pre></div></div><details class="box"><summary>特殊属性与历史疑点</summary><p>场景：${esc(r.scene)}；OOS：${esc(r.oos_subtype)}；门洞：${esc(r.doorway_status)}</p><p>旧疑点（未必仍待处理）：${esc(r.old_visual_question)}</p><p>GT问题：${esc(r.previous_reference_issue)}；范围记录：${esc(JSON.stringify(r.previous_scope_note))}</p><small>“认可建议”对应该次审核记录内的原建议档，不能解释为认可本轮新档。旧意见未用于拟合本轮分组阈值。</small></details>`;
 let d=drafts[r.image_id];$('grade').value=d?.grade||'';$('note').value=d?.note||'';$('saved').textContent=`已保存 ${Object.keys(drafts).length} 张草稿`;
}
function save(){let r=visible[idx];if(!r)return;drafts[r.image_id]={image:r.image,image_id:r.image_id,target_version:r.target_version,review_version:DATA.version,proposed_class:r.current_class,conditional_difficulty:r.conditional_difficulty,grade:$('grade').value,note:$('note').value,updated_at:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(drafts));$('saved').textContent=`已保存 ${Object.keys(drafts).length} 张草稿`}
$('search').oninput=refresh;$('pick').onchange=()=>{idx=Number($('pick').value);show()};$('prev').onclick=()=>{idx--;show()};$('next').onclick=()=>{idx++;show()};$('grade').onchange=save;$('note').oninput=save;
$('export').onclick=()=>{let data={schema:'scope_preferred_difficulty_user_review_v2',review_version:DATA.version,records:Object.values(drafts)},u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='image_difficulty_scope_preferred_my_review.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};refresh();
</script></html>
