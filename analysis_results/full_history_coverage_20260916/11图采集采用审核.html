function fieldClass(v,b){return JSON.stringify(v)===JSON.stringify(b)?'initial':'changed'}
function raw(title,value){return '<details><summary>'+E(title)+'</summary><pre>'+E(JSON.stringify(value,null,2))+'</pre></details>'}
function relationEditor(rel,i,baseline){return `<div class="relation"><div><input aria-label="区域A" data-rel="${i}" data-key="region_a" class="${fieldClass(rel.region_a,baseline?.region_a)}" value="${E(rel.region_a)}"><span>↔</span><input aria-label="区域B" data-rel="${i}" data-key="region_b" class="${fieldClass(rel.region_b,baseline?.region_b)}" value="${E(rel.region_b)}"><select aria-label="分隔关系" data-rel="${i}" data-key="relation" class="${fieldClass(rel.relation,baseline?.relation)}">${relationTypes.map(x=>`<option ${rel.relation===x?'selected':''}>${E(x)}</option>`).join('')}</select><button data-remove="${i}" aria-label="删除这条关系">删除</button></div><label class="field"><span>可见结构依据</span><input data-rel="${i}" data-key="evidence" class="${fieldClass(rel.evidence,baseline?.evidence)}" value="${E(rel.evidence)}"></label></div>`}
function render(){
 const f=document.getElementById('filter').value,q=document.getElementById('search').value.trim().toLowerCase();
 const visible=rows.filter(r=>(f==='全部'||f==='需核实'&&r.ai.human_conflicts.length>0||f==='有不确定性'&&r.ai.uncertainties.length>0||f==='有OOS记录'&&r.oos_events.length>0||f==='本轮已填写'&&edits[r.image_id])&&(!q||[r.building,r.number,r.groups.join(' '),r.ai.main_space,r.ai.functional_regions.join(' ')].join(' ').toLowerCase().includes(q)));
 const pages=Math.max(1,Math.ceil(visible.length/pageSize));page=Math.min(page,pages-1);
 document.getElementById('count').textContent=`${visible.length}图 · ${page+1}/${pages}页`;
 document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===pages-1;
 document.getElementById('cards').innerHTML=visible.slice(page*pageSize,(page+1)*pageSize).map(r=>{
  const b=base(r),v=edits[r.image_id]||b;
  const history=r.history;
  return `<article data-id="${E(r.image_id)}"><h2>${E(r.building)} · ${String(r.number).padStart(2,'0')} <span class="muted">${E(r.groups.join(' / '))}</span></h2>
  <span class="badge">当前粗类：${E(r.coarse.value||'分类未定')}</span><span class="badge">${r.coarse.human_accepted?'本次用户认可主区后归并':'沿用既有粗类'}</span><span class="badge">${E(r.oos.latest_explicit_opinion?'最新OOS意见：'+r.oos.latest_explicit_opinion:r.oos.status)}</span>
  <a href="../../${E(r.path)}" target="_blank"><img class="pano" loading="lazy" src="../../${E(r.path)}" alt="${E(r.building)} ${r.number} 全景原图"></a>
  ${r.ai.human_conflicts.length?'<div class="warn"><b>需与你核实的同一事实判断</b>'+r.ai.human_conflicts.map(c=>'<p>'+E(c.field)+'：人工 '+E(c.human_value)+'；AI '+E(c.ai_value)+'<br>'+E(c.reason)+'<br><small>'+E(c.human_source)+'</small></p>').join('')+'</div>':''}
    <label class="field"><span>本轮采集是否采用（请手动选择）</span><select data-field="status" class="${fieldClass(v.status,b.status)}">${statuses.map(s=>`<option ${v.status===s?'selected':''}>${E(s)}</option>`).join('')}</select></label>
  <label class="field"><span>采用理由／问题／条件（请注明OOS、空间边界或其他疑问）</span><textarea data-field="note" class="${fieldClass(v.note,b.note)}">${E(v.note)}</textarea></label><div class="warn"><b>本轮拟安排：</b>新增15位新人；当前可计历史Manual ${r.collection_proposal.history_manual}人。<br><b>已有同房支持：</b>${E(r.collection_proposal.supported_rooms.join(" / ")||"尚无已支持同房组；不能将本图直接当作独立房间")}<br><b>候选状态：</b>${E(r.collection_proposal.review)}<br><b>入选理由：</b>${E(r.collection_proposal.reason)}</div><details><summary>空间描述与历轮人工记录（可展开核对）</summary><div class="grid"><section><h3>原建议／可选补充</h3>
  <label class="field"><span>功能区域（多个用＋分开）</span><input data-field="functional_regions" class="${fieldClass(v.functional_regions,b.functional_regions)}" value="${E(v.functional_regions.join('＋'))}"></label>
  <label class="field"><span>主区域补充描述（不是分类名称）</span><input data-field="main_space" class="${fieldClass(v.main_space,b.main_space)}" value="${E(v.main_space)}"></label>
  <h4>区域之间的关系</h4>${v.relations.map((x,i)=>relationEditor(x,i,b.relations[i])).join('')}
  <button data-add>增加一条关系</button><p class="muted">${E(r.ai.relation_scope_note)}</p>
</section>
  <section><h3>原人工判断与依据</h3><div class="human">原采用粗类：${E(r.adopted.coarse_type||'未单独归一化，见原文')}<br>原功能：${E(r.adopted.functions||'无独立字段')}<br>原主区域／复核保留值：${E(r.adopted.focus||'见早期区域类别和评论')}<br>主区域来源：${E(r.field_sources.focus)}<br>原门洞工作记录：${E(r.doorway.doorway.current_working_label)}<br>一般交界：${E(r.doorway.general_boundary||'未单列')}</div>
  <p><b>本轮AI依据：</b>${E(r.ai.reason)}</p><p>${E(r.ai.human_comparison)}</p>${r.root_crosscheck?'<p><b>主代理原图交叉意见：</b>'+E(r.root_crosscheck.reason)+'</p>':''}
  ${r.ai.uncertainties.length?'<p class="warn">待定信息：'+E(r.ai.uncertainties.join('；'))+'</p>':''}
  ${raw('当前粗类及来源',r.coarse)}${raw('本次对话已解决的历史争议',r.resolved_conflicts)}${raw('历轮人工评论及讨论',r.comments)}${raw('首次648图：原始填写',history.initial_648)}${raw('早期争议复核：原始填写',history.early_dispute)}
  ${raw('后续空间复核：预填、改值及合成值（该轮'+(history.later_personally_reviewed?'在亲审范围':'不在亲审范围')+'）',history.later_spatial)}
  ${raw('早期配对实际填写',r.pair_reviews)}${raw('整组复核原始记录',r.group_reviews)}${raw('最新选图填写',r.selection)}
  ${raw('OOS原文、作用范围与来源',r.oos_events)}${raw('门洞历轮人工与AI台账',r.doorway)}${raw('全部本轮AI续审证据',r.ai)}</section></div></details></article>`;
 }).join('')||'<article>当前筛选没有图片。</article>';
}
document.getElementById('cards').addEventListener('input',e=>{
 const el=e.target,article=el.closest('article');if(!article||(!el.dataset.field&&!el.dataset.key))return;
 const id=article.dataset.id,r=byId.get(id),v=edits[id]||(edits[id]=clone(base(r))),b=base(r);
 if(el.dataset.field){const k=el.dataset.field;v[k]=k==='functional_regions'?el.value.split(/[＋+、,，]/).map(x=>x.trim()).filter(Boolean):el.value;el.className=fieldClass(v[k],b[k])}
 else{const i=Number(el.dataset.rel),k=el.dataset.key;v.relations[i][k]=el.value;el.className=fieldClass(el.value,b.relations[i]?.[k])}
 store();
});
document.getElementById('cards').addEventListener('click',e=>{const el=e.target,a=el.closest('article');if(!a)return;const id=a.dataset.id;
 if(el.hasAttribute('data-add')||el.hasAttribute('data-remove')){const v=edits[id]||(edits[id]=clone(base(byId.get(id))));if(el.hasAttribute('data-add'))v.relations.push({region_a:'',region_b:'',relation:'无法判断',evidence:''});else v.relations.splice(Number(el.dataset.remove),1);store();render()}});
document.getElementById('filter').onchange=()=>{page=0;render()};document.getElementById('search').oninput=()=>{page=0;render()};
document.getElementById('prev').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};
document.getElementById('export').onclick=()=>{
 const decisions=rows.map(r=>{const initial=base(r),current=edits[r.image_id]||initial;return {image_id:r.image_id,building:r.building,number:r.number,initial_ai:initial,current,has_user_input:!!edits[r.image_id],changed_fields:Object.keys(initial).filter(k=>JSON.stringify(initial[k])!==JSON.stringify(current[k]))}});
 const result={schema,source_key:key,proposal_source:'analysis_results/full_history_coverage_20260916/全历史覆盖机器表.json',source_machine_table:'analysis_results/spatial_dimensions_review_20260913_v2/空间描述与历轮人工记录.json',interpretation:'新增人工填写层；历轮原文通过source_machine_table关联保留，未填不等于确认或否定。',saved_at:new Date().toISOString(),decisions};
 const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='11图采集采用_我的审核.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
document.getElementById('import').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{try{
 const file=e.target.files[0];if(!file)return;const d=JSON.parse(await file.text());if(d.schema!==schema||d.source_key!==key||!Array.isArray(d.decisions))throw Error('不是本页导出的复核文件；旧轮记录已在来源区保留');
 const next={},seen=new Set();for(const x of d.decisions){if(!byId.has(x.image_id)||seen.has(x.image_id))throw Error('图片身份重复或不匹配');seen.add(x.image_id);validate(x.current);if(x.has_user_input)next[x.image_id]=x.current}
 if(seen.size!==rows.length)throw Error('不是完整11图导出');edits={...edits,...next};store();render();
 }catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};
render();
</script></html>
