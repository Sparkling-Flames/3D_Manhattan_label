<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>259图：范围与难度复核</title>
<style>body{font:16px/1.6 system-ui,sans-serif;margin:20px;background:#f5f6f8;color:#172537}header,section{background:white;padding:18px;border-radius:12px;margin:12px 0}h1{font-size:25px;margin:0}h2{font-size:20px;margin:0 0 10px}select,input,button,textarea{font:inherit;padding:6px;margin:4px;border:1px solid #abb6c1;border-radius:5px}button{cursor:pointer;background:#e9f2ff}#card{width:100%;height:auto}#detail{max-width:1800px;margin:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #d5dbe1;padding:5px;text-align:left}textarea{width:95%;height:65px}.muted{color:#566574}.tag{background:#eef2fa;padding:4px 9px;border-radius:5px}a{color:#075caf}nav{display:flex;flex-wrap:wrap;align-items:center}#status{color:#075a37}details{margin:12px 0}#warn{color:#934600}.opinion{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:16px 0}.opinion article{background:#edf4ff;border:1px solid #cadcf5;border-radius:10px;padding:14px}.opinion article:last-child{background:#fff7e7;border-color:#edd5a2}.opinion h3{margin:0 0 8px;font-size:16px}.opinion p{margin:6px 0}.decision{font-size:19px;font-weight:650}.review-input{background:#f2f7f5;border-radius:10px;padding:16px;margin-top:18px}header p{margin:8px 0;font-size:14px}#case{max-width:55vw}summary{cursor:pointer;color:#075caf}@media(max-width:900px){.opinion{grid-template-columns:1fr}body{margin:8px}} </style>
<div id="detail"><header><h1>259图：目标范围与难度复核</h1><p>每张图先展示我的判断、具体依据和待确认问题。默认汇总需要复审的图片；可切换到范围候选或改档建议。蓝线 Manual，紫线 Semi，绿线 OOS；红线当前查看GT，黄虚线原GT。</p>
<nav><label>筛选<select id="filter"><option value="review">需要我复审的图（合并去重）</option><option value="extent">范围差异优先候选</option><option value="change">明确改档建议</option><option value="uncertain">视觉待复核</option><option value="special">OOS／门洞单列</option><option value="geometry">非excluded组几何信号</option><option value="all">全部259图</option></select></label><label>搜索<input id="search" placeholder="图片代码"></label><button id="export">导出我的复核JSON</button></nav>
<p id="status"></p><p id="warn"></p><nav><button id="prev">上一张</button><select id="case"></select><button id="next">下一张</button><span id="count"></span></nav></header>
<section id="content"></section></div>
<script>const DATA=__REVIEW_DATA__;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='image-difficulty-review-259-20261010-v1';let drafts={},list=[],current=null;
try{drafts=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){$('warn').textContent='本地草稿不可读取；本次填写后请导出JSON保存。'}
const label={extent_candidate:'目标范围差异候选',geometry_or_reference_uncertain:'几何／参考解释待核',local_or_minority_candidate:'局部或少数范围候选',insufficient_records:'作答数量有限',no_major_mismatch_seen:'筛查未见明显大范围差异'};
function needsReview(r){return r.changed_grade||['待复核','单列'].includes(r.visual.difficulty_recommendation)||['extent_candidate','geometry_or_reference_uncertain','local_or_minority_candidate'].includes(r.scope_category)}
function filtered(){const f=$('filter').value,q=$('search').value.trim().toLowerCase();return DATA.filter(r=>(!q||r.image.toLowerCase().includes(q))&&(f==='all'||f==='review'&&needsReview(r)||f==='extent'&&r.scope_category==='extent_candidate'||f==='change'&&r.changed_grade||f==='uncertain'&&r.visual.difficulty_recommendation==='待复核'||f==='special'&&r.visual.difficulty_recommendation==='单列'||f==='geometry'&&r.meaningful_geometry_signal))}
function refresh(){list=filtered();$('case').innerHTML=list.map(r=>`<option value="${esc(r.image)}">${esc(r.image)} · ${esc(r.visual.difficulty_recommendation)}</option>`).join('');current=list.find(r=>r.image===current?.image)||list[0];if(current)$('case').value=current.image;render()}
function opinion(r){const v=r.visual;
const recommendation=r.changed_grade?`建议从「${r.working_class}」改为「${v.difficulty_recommendation}」`:v.difficulty_recommendation==='待复核'?'暂不定档，先核实目标或参考':v.difficulty_recommendation==='单列'?'保留特殊场景，单独评价':`照片难度倾向「${v.difficulty_recommendation}」`;
const question=v.uncertainty_reason||(r.changed_grade?'请确认你是否认可这个改档；若不认可，指出哪处可见性判断不合适。':r.scope_category==='extent_candidate'?'请确认应标到哪里：人员停止的位置，还是GT延伸的区域？':r.scope_category==='geometry_or_reference_uncertain'?'请判断这里主要是点位/深度误差，还是选了不同目标空间；不能确定可保留待核。':r.scope_category==='local_or_minority_candidate'?'请确认这处局部分支是否必须纳入目标，还是可以简化。':'请确认主要转折是否清楚，遮挡是否仅限局部下端。');
return `<div class="opinion" id="opinion"><article><h3>我的难度判断</h3><p class="decision">${esc(recommendation)}</p><p>${esc(v.visible_evidence)}</p></article><article><h3>我对范围的看法</h3><p><b>${esc(label[r.scope_category])}</b></p><p>${esc(r.scope_note)}</p></article><article><h3>需要你确认什么</h3><p>${esc(question)}</p><p class="muted">这是我的审查建议，尚未替代你的判断或修改GT。</p></article></div>`;
}
function render(){if(!current){$('content').innerHTML='<p>没有符合筛选的图片。</p>';$('count').textContent='0图';return}const r=current,v=r.visual,d=drafts[r.image]||{};$('count').textContent=`${list.indexOf(r)+1} / ${list.length}`;
const groups=r.condition_gate_groups.map(g=>`<tr><td>${esc(g.condition)}</td><td>${esc(g.gate)}</td><td>${g.n}份／${g.workers}人</td><td>${g.invalid}</td><td>${g.flagged_counts['0.2']} / ${g.flagged_counts['0.3']} / ${g.flagged_counts['0.4']}</td><td>${(g.fraction_lower*100).toFixed(0)}%–${(g.fraction_upper*100).toFixed(0)}%</td></tr>`).join('');
$('content').innerHTML=`<h2>${esc(r.image)}</h2><p><span class="tag">原工作类 ${esc(r.working_class)}</span> → <span class="tag">视觉建议 ${esc(v.difficulty_recommendation)}</span>　N=${r.N}，H=${r.H}，H/N=${(r.H/r.N).toFixed(2)}　场景：${esc(r.scene)}</p>${opinion(r)}<a href="${esc(r.card)}" target="_blank"><img id="card" src="${esc(r.card)}" alt="原照片GT叠加及全部可计算人员底面对照"></a><p class="muted">点图可放大。${r.n}份记录中${r.valid_geometry}份可画；叠图包含不同资格，不能当作等资格投票。</p><details id="metrics"><summary>展开数值与逐份记录（辅助证据）</summary><p class="muted">D=人员底面与GT对称差面积／GT面积，仅作找问题；不是难度分，也不是已确认范围不一致的票数。范围语义需看图裁定。上下界把不可算记录分别视为未超阈值／超阈值，不是置信区间。</p><table><thead><tr><th>条件</th><th>原资格</th><th>分母</th><th>不可算</th><th>超D=0.2／0.3／0.4份数</th><th>D≥0.3可能比例</th></tr></thead><tbody>${groups}</tbody></table><details><summary>逐份记录及原／修订GT几何差</summary><table><tr><th>记录</th><th>人员</th><th>条件／资格</th><th>几何状态</th><th>D当前／原GT</th></tr>${r.records.map(o=>`<tr><td>${esc(o.record_id)}</td><td>${esc(o.worker_id)}</td><td>${esc(o.condition)}／${esc(o.gate)}</td><td>${esc(o.geometry_status)}</td><td>${o.selected_gt_metrics?.symmetric_difference.toFixed(3)??'NA'}／${o.original_gt_metrics?.symmetric_difference.toFixed(3)??'NA'}</td></tr>`).join('')}</table></details></details><div class="review-input"><h2>你的复审意见</h2><label>难度<select id="grade">${['未审','认可建议','简单','中等','困难','特殊单列','待复核'].map(x=>`<option${d.grade===x?' selected':''}>${x}</option>`).join('')}</select></label><label>范围<select id="scope">${['未审','目标基本一致','范围明显不同','GT需核查','不能确定'].map(x=>`<option${d.scope===x?' selected':''}>${x}</option>`).join('')}</select></label><p><textarea id="note" placeholder="可简单写：这里应停在门口／六点但看得清楚……">${esc(d.note||'')}</textarea></p><p class="muted">只保存你的复核意见，不改GT、原标注或正式分类。浏览器草稿之外，请导出JSON作为提交文件。</p></div>`;
for(const id of ['grade','scope','note'])$(id).addEventListener(id==='note'?'input':'change',save);updateStatus()}
function save(){drafts[current.image]={grade:$('grade').value,scope:$('scope').value,note:$('note').value,updated_at:new Date().toISOString()};try{localStorage.setItem(KEY,JSON.stringify(drafts))}catch(e){$('warn').textContent='草稿未能写入浏览器存储，请立即导出JSON。'}updateStatus()}
function updateStatus(){$('status').textContent=`已有 ${Object.keys(drafts).length} 张填写记录。`}
$('filter').onchange=refresh;$('search').oninput=refresh;$('case').onchange=()=>{current=list.find(r=>r.image===$('case').value);render()};
for(const [id,step] of [['prev',-1],['next',1]])$(id).onclick=()=>{if(!list.length)return;current=list[(list.indexOf(current)+step+list.length)%list.length];$('case').value=current.image;render()};
$('export').onclick=()=>{const results=DATA.filter(r=>drafts[r.image]).map(r=>({image:r.image,image_id:r.image_id,gt_object_id:r.gt_object_id,original_working_class:r.working_class,proposed_class:r.visual.difficulty_recommendation,...drafts[r.image]}));const blob=new Blob([JSON.stringify({schema:'image_difficulty_user_review_v1',review_version:KEY,exported_at:new Date().toISOString(),records:results},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='image_difficulty_my_review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
refresh();</script></html>
