function drawERP(){const ctx=$('erp').getContext('2d');ctx.clearRect(0,0,1024,512);if(photo)ctx.drawImage(photo,0,0,1024,512);else{ctx.font='22px sans-serif';ctx.fillText('尚未载入该原图；当前不能作RGB视觉裁决。',80,240)}for(const l of layers()){ctx.setLineDash(l.dash);ctx.lineWidth=2;strokeRing(ctx,xyzs(l));if(l.h)strokeRing(ctx,l.x.map((p,i)=>[p[0],l.h[i]-1,p[1]]));ctx.setLineDash([])}const r=response();for(const p of r.positions){ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.stroke()}$('marked').textContent=r.positions.map(p=>`(${p.x.toFixed(1)}, ${p.y.toFixed(1)})`).join('；');drawCrop()}
function drawCrop(){const ctx=$('crop').getContext('2d'),x=Number($('cropx').value),src=$('erp');ctx.clearRect(0,0,1024,512);let left=x-128;for(let shift of [-1024,0,1024]){let a=Math.max(0,left-shift),b=Math.min(1024,left+256-shift);if(b>a)ctx.drawImage(src,a,80,b-a,256,(a+shift-left)*4,0,(b-a)*4,512)}ctx.font='16px sans-serif';ctx.fillText('ERP局部裁剪（非透视重投影），横向宽256px，纵向80–336px',10,500)}
function show(){const c=current(),r=response();$('choice').value=index;if(c.crop_center_x!==undefined)$('cropx').value=c.crop_center_x;$('status').textContent=c.floor?'几何已载入；'+(photo?'原图已载入':'尚未载入原图'):'该卡没有可用几何；禁止推定为低质量';$('binding').textContent=payload.mode==='scope'?`${c.display_id}｜${c.condition||''}｜${c.cleaning||''}`:c.display_id;$('grade').value=r.grade||'';$('scope').value=r.scope||'';$('comment').value=r.comment||'';$('scopequestion').classList.toggle('hidden',payload.mode!=='scope');$('newlabel').classList.toggle('hidden',!c.new_floor);$('tops').innerHTML='<tr><th>新底角</th><th>固定经度 x</th><th>待核顶部 y（可留空）</th></tr>';if(c.new_floor)c.new_floor.forEach((p,i)=>{const x=erpPoint([p[0],-1,p[1]])[0],tr=document.createElement('tr');const td0=document.createElement('td');td0.textContent='N'+i;tr.appendChild(td0);const td1=document.createElement('td');td1.textContent=x.toFixed(3);tr.appendChild(td1);const td=document.createElement('td'),inp=document.createElement('input');inp.type='number';inp.min='0';inp.max='511';inp.step='.1';inp.dataset.corner=i;inp.dataset.x=x;inp.value=r.top_suggestions.find(v=>v.corner===i)?.y??'';td.appendChild(inp);tr.appendChild(td);$('tops').appendChild(tr)});drawGeom();drawERP()}
async function loadPhoto(){photo=null;const c=current(),f=files.get(c.image_id+'.png')||files.get(c.image_id+'.jpg')||files.get(c.image_id+'.jpeg');if(f||c.photo_path){const im=new Image();const url=f?URL.createObjectURL(f):c.photo_path;await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=url}).catch(()=>{});if(im.naturalWidth){photo=im;const r=response();r.photo_seen=true;r.photo_filename=f?f.name:c.photo_path;responses[c.display_id]=r;}if(f)URL.revokeObjectURL(url)}show()}
function save(){const c=current(),r=response();r.grade=$('grade').value||null;r.scope=$('scope').value||null;r.comment=$('comment').value;r.top_suggestions=[...$('tops').querySelectorAll('input')].filter(e=>e.value!=='').map(e=>({corner:Number(e.dataset.corner),x:Number(e.dataset.x),y:Number(e.value),status:'human_suggestion_not_automatic_reference'}));r.reviewed_at=new Date().toISOString();responses[c.display_id]=r;try{localStorage.setItem(storageKey,JSON.stringify(responses));$('saved').textContent='已保存本地；仍需导出JSON。'}catch(e){$('saved').textContent='已保存在当前页面；浏览器未允许本地持久存储，请立即导出JSON。'}}
$('prev').onclick=()=>{save();index=(index+cards.length-1)%cards.length;loadPhoto()};$('next').onclick=()=>{save();index=(index+1)%cards.length;loadPhoto()};$('choice').onchange=()=>{save();index=Number($('choice').value);loadPhoto()};function photoFiles(e){files=new Map([...e.target.files].map(f=>[f.name,f]));loadPhoto()}$('photos').onchange=photoFiles;$('photofiles').onchange=photoFiles;$('save').onclick=save;$('export').onclick=()=>{save();const result={schema:'quality_next_review_v1',panel_id:payload.panel_id,mode:payload.mode,no_scores_or_model_identity_shown:true,decisions:Object.values(responses)};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));a.download=payload.panel_id+'_receipt.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
for(const id of ['showa','showg','shown'])$(id).onchange=()=>{drawGeom();drawERP()};$('cropx').oninput=drawCrop;$('reset').onclick=()=>{yaw=.6;pitch=.7;drawGeom()};$('bev').onclick=()=>{yaw=0;pitch=Math.PI/2;drawGeom()};let drag=null;$('geom').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('geom').setPointerCapture(e.pointerId)};$('geom').onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.01;pitch=Math.max(-1.5,Math.min(1.57,pitch+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];drawGeom()}};$('geom').onpointerup=()=>drag=null;$('erp').onclick=e=>{const b=$('erp').getBoundingClientRect(),r=response();r.positions.push({x:(e.clientX-b.left)*1024/b.width,y:(e.clientY-b.top)*512/b.height});responses[current().display_id]=r;drawERP()};
loadPhoto();
</script></html>
