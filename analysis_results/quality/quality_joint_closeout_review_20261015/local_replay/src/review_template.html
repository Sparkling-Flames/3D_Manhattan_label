<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>质量模型后续批量核验</title><style>body{max-width:1160px;margin:32px auto;padding:0 20px;font:16px/1.65 sans-serif}header{border-bottom:2px solid;padding-bottom:15px}.card{border:1px solid #bbb;padding:18px;margin:28px 0}img{width:100%;height:auto}canvas{width:100%;height:480px;border:1px solid #ddd;touch-action:none}button,select,textarea{padding:8px;margin:6px;font:inherit}textarea{width:94%}.notice{background:#eee;padding:12px}small{display:block}label{margin:12px;display:inline-block}</style><header><h1>后续批量核验</h1><p>不要求每份分数符合个人刻度；本页不显示算法、分数或候选选择理由。拖动三维、滚轮缩放；实线为A，短虚线为B，长虚线为参考。几何与参考未经修改。</p><p>本批是既有开发数据中的分层核验候选，不是独立盲测。缺原图时不要仅凭线框作视觉质量裁决；未作答保留空值。</p><button id="export">导出本地回答</button><span id="count"></span></header><main id="cards"></main><script>
const DATA=__DATA__;
const KEY='quality_closeout_review_134e7c7_v1';let answers={};try{answers=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{localStorage.setItem(KEY,JSON.stringify(answers));document.getElementById('count').textContent=Object.keys(answers).length+' 个条目有保存记录'};
function project(p,yaw,pitch){let x=p[0]*Math.cos(yaw)-p[2]*Math.sin(yaw),z=p[0]*Math.sin(yaw)+p[2]*Math.cos(yaw);return[x,p[1]*Math.cos(pitch)-z*Math.sin(pitch)]}
for(const card of DATA){const e=document.createElement('section');e.className='card';const title=document.createElement('h2');title.textContent=card.case_id+' · '+card.image_code+' · '+card.record_ids.join(' / ');e.append(title);const n=document.createElement('p');n.className='notice';n.textContent=card.notice;e.append(n);if(card.photo){let im=document.createElement('img');im.src=card.photo;im.alt=card.image_code+' 原始全景';e.append(im)}else{let no=document.createElement('p');no.textContent='本包未取得本图原图。请按 image_id 补充原图后再判断；线框不可替代图像证据。';e.append(no)}
const c=document.createElement('canvas');c.width=1080;c.height=480;e.append(c);let yaw=.5,pitch=.6,zoom=1,down=null;const pts=card.geometry.flatMap(g=>Object.values(g.geometry).flat());let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(let p of [...pts,[0,0,0]])for(let j=0;j<3;j++){lo[j]=Math.min(lo[j],p[j]);hi[j]=Math.max(hi[j],p[j])}const mid=lo.map((v,j)=>(v+hi[j])/2),span=Math.max(...hi.map((v,j)=>v-lo[j]),1);
function draw(){let x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.font='15px sans-serif';let scale=370/span*zoom;const to=(p)=>{let v=project(p.map((q,j)=>q-mid[j]),yaw,pitch);return[c.width/2+v[0]*scale,c.height/2-v[1]*scale]};function line(a,b){x.beginPath();x.moveTo(...to(a));x.lineTo(...to(b));x.stroke()}
card.geometry.forEach((g,k)=>{x.setLineDash(k===0?[]:k===1&&g.label==='B'?[4,4]:[14,5]);x.lineWidth=1.5;for(const name of ['bottom3d','top3d']){const p=g.geometry[name];if(p)for(let i=0;i<p.length;i++)line(p[i],p[(i+1)%p.length])}if(g.geometry.top3d)g.geometry.top3d.forEach((p,i)=>line(p,g.geometry.bottom3d[i]));x.fillText(g.label,15,25+22*k)});x.setLineDash([]);let cam=to([0,0,0]);x.beginPath();x.arc(...cam,4,0,Math.PI*2);x.fill();x.fillText('相机',cam[0]+7,cam[1]);x.fillText('尺度单位：相机高度；相同画布共同尺度',15,465)}draw();c.onpointerdown=v=>{down=[v.clientX,v.clientY];c.setPointerCapture(v.pointerId)};c.onpointermove=v=>{if(!down)return;yaw+=(v.clientX-down[0])*.007;pitch=Math.max(-1.57,Math.min(1.57,pitch+(v.clientY-down[1])*.007));down=[v.clientX,v.clientY];draw()};c.onpointerup=()=>down=null;c.onwheel=v=>{v.preventDefault();zoom=Math.max(.2,Math.min(6,zoom*Math.exp(-v.deltaY*.001)));draw()};for(let [label,fn] of [['重置',()=>{yaw=.5;pitch=.6;zoom=1}],['俯视',()=>{yaw=0;pitch=Math.PI/2;zoom=1}],['正视',()=>{yaw=0;pitch=0;zoom=1}]]){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{fn();draw()};e.append(b)}
const old=answers[card.case_id]||{};function field(id,label,opts){let l=document.createElement('label');l.textContent=label;let s=document.createElement('select');for(let [v,t] of [['','未回答'],...opts]){let a=document.createElement('option');a.value=v;a.textContent=t;s.append(a)}s.value=old[id]||'';s.onchange=()=>{answers[card.case_id]={...(answers[card.case_id]||{}),[id]:s.value||null,record_ids:card.record_ids,image_code:card.image_code,updated_at:new Date().toISOString()};save()};l.append(s);e.append(l)}
if(card.kind==='reference'){field('reference_material','参考资料状态',[['precise_available','已有精确参考可补入'],['still_missing','精确参考仍缺失'],['uncertain','无法判断']])}else{field('scope','目标比较',[['same','同一目标可比较'],['different','合法目标不同'],['reference_uncertain','参考仍未确定'],['uncertain','无法判断']]);field('overall',card.kind==='floor'?'仅底面质量区分':'质量区分',card.record_ids.length>1?[['A','A较好'],['B','B较好'],['close','接近，无明确优劣'],['uncertain','无法判断']]:[['mostly_good','整体较好'],['local_problem','局部明显问题'],['widespread_problem','多处明显问题'],['uncertain','无法判断']]);}let ta=document.createElement('textarea');ta.placeholder='判断依据、局部问题或缺少的观察（可留空）';ta.value=old.comment||'';ta.onchange=()=>{answers[card.case_id]={...(answers[card.case_id]||{}),comment:ta.value,record_ids:card.record_ids,image_code:card.image_code,updated_at:new Date().toISOString()};save()};e.append(ta);document.getElementById('cards').append(e)}
document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify({schema:'quality_closeout_batch_receipt_v1',source:'134e7c775b9ea25a076851c0605571ba0ea0ac31',independent_blind:false,answers},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='quality_closeout_batch_receipt.json';a.click();URL.revokeObjectURL(a.href)};save();
</script></html>
