<script>
'use strict';
const payload=JSON.parse(document.getElementById('payload').textContent),cards=payload.cards;let index=0,yaw=.6,pitch=.7,photo=null,files=new Map(),responses={};const $=id=>document.getElementById(id);const storageKey='layout_next_review_'+payload.panel_id;

function layers(){const c=current(),a=[];if(c.floor&&$('showa').checked)a.push({x:c.floor,h:c.height,dash:[],label:'作答'});if(c.original_floor&&$('showg').checked)a.push({x:c.original_floor,h:c.original_height,dash:[10,6],label:'原参考'});if(c.new_floor&&$('shown').checked)a.push({x:c.new_floor,h:null,dash:[2,5],label:'新底面'});return a}
function xyzs(l){return l.x.map(p=>[p[0],-1,p[1]])}
function worldPoints(){return layers().flatMap(l=>xyzs(l).concat(l.h?l.x.map((p,i)=>[p[0],l.h[i]-1,p[1]]):[]))}
function drawGeom(){const can=$('geom'),ctx=can.getContext('2d');ctx.clearRect(0,0,can.width,can.height);const pts=worldPoints();if(!pts.length){ctx.fillText('配对不可用；未补点、未补分。',50,60);return}function rotate(p){let x=p[0]*Math.cos(yaw)-p[2]*Math.sin(yaw),z=p[0]*Math.sin(yaw)+p[2]*Math.cos(yaw);return[x,z*Math.sin(pitch)-p[1]*Math.cos(pitch)]}const rr=pts.map(rotate).concat([rotate([0,0,0])]),xmin=Math.min(...rr.map(p=>p[0])),xmax=Math.max(...rr.map(p=>p[0])),ymin=Math.min(...rr.map(p=>p[1])),ymax=Math.max(...rr.map(p=>p[1])),s=Math.min(940/(xmax-xmin+.1),360/(ymax-ymin+.1));function proj(p){let r=rotate(p);return[can.width/2+s*(r[0]-(xmin+xmax)/2),can.height/2+s*(r[1]-(ymin+ymax)/2)]}let legend=0;for(const l of layers()){ctx.setLineDash(l.dash);ctx.lineWidth=2;ctx.beginPath();const b=xyzs(l),t=l.h?l.x.map((p,i)=>[p[0],l.h[i]-1,p[1]]):[];for(const ring of [b,t])if(ring.length){ring.forEach((p,i)=>{const q=proj(p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath()}for(let i=0;i<t.length;i++){ctx.moveTo(...proj(b[i]));ctx.lineTo(...proj(t[i]))}ctx.stroke();ctx.setLineDash([]);ctx.font='13px sans-serif';b.forEach((p,i)=>{let q=proj(p);ctx.fillText(l.label+i,q[0]+3,q[1]-3)});ctx.fillText(l.label,20,24+legend++*20)}let cam=proj([0,0,0]);ctx.beginPath();ctx.arc(...cam,4,0,Math.PI*2);ctx.stroke();ctx.fillText('相机',cam[0]+7,cam[1]);ctx.fillText('长度单位：相机高度；底平面 y=-1；无新增顶界。',20,460)}
function erpPoint(p){const r=Math.hypot(p[0],p[2]);return[(((Math.atan2(p[0],-p[2])/(2*Math.PI)+.5)*1024)%1024+1024)%1024,(.5-Math.atan2(p[1],r)/Math.PI)*512]}

async function loadPhoto(){photo=null;const c=current(),f=files.get(c.image_id+'.png')||files.get(c.image_id+'.jpg')||files.get(c.image_id+'.jpeg');if(f||c.photo_path){const im=new Image();const url=f?URL.createObjectURL(f):c.photo_path;await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=url}).catch(()=>{});if(im.naturalWidth){photo=im;const r=response();r.photo_seen=true;r.photo_filename=f?f.name:c.photo_path;responses[c.display_id]=r;}if(f)URL.revokeObjectURL(url)}show()}
