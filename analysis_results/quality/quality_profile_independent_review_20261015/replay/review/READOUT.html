<!doctype html><meta charset="utf-8"><title>普通作答五档研究读数</title><style>body{font:17px/1.7 system-ui;max-width:850px;margin:35px auto;padding:20px}table{border-collapse:collapse}td,th{padding:10px;border:1px solid #bbb}</style><h1>普通作答五档研究读数</h1><p>仅解释固定WQ的读数，不修改WQ，不是正确概率。仅适用于同范围、完整参考的普通manual开发域；不用于门洞、OOS、参考暂缓、仅底面或人员资格自动裁决。</p><label>WQ（0–100）：<input id="q" type="number" min="0" max="100" value="70" step=".1"></label><button id="go">查看</button><h2 id="median"></h2><p id="warning"></p><table id="probs"></table><p>模型：正斜率累积logit。30份开发反馈、26图、9建筑，五档支持为1／2／12／10／5（由差至好）。下端两个切点证据特别弱。显示的是该选样条件下的模型读数，不能外推为一般人群评价比例。</p><script>const cfg={"slope": 14.21059705934833, "thresholds": [3.3130866818136697, 4.2355842331909805, 8.243055312430476, 11.739616736164773], "q_at_cumulative_half": [23.314197622922403, 29.805814741644753, 58.00639676154808, 82.61170651124723], "ridge": 0.01, "converged": true, "objective": 20.67784951676404, "n": 30, "class_counts": [1, 2, 12, 10, 5]},labels=['较差','一般与较差之间','一般','较好与一般之间','较好'];function render(){let q=Number(document.getElementById('q').value);if(!Number.isFinite(q)||q<0||q>100)return;let c=cfg.thresholds.map(t=>1/(1+Math.exp(-(t-cfg.slope*q/100)))),all=[0,...c,1],p=all.slice(1).map((x,i)=>x-all[i]);document.getElementById('median').textContent='暂定中位粗档：'+labels[c.filter(x=>x<.5).length];document.getElementById('warning').textContent=q<40?'低分端支持不足：只作待核验候选，不可靠地区分两个低档。':((q>=52.9&&q<=62.8)||(q>=78.8&&q<=85.8))?'接近建筑重采样的切点不稳定区：允许相邻档意见。':'仍为开发读数，需要下一批人工核验。';document.getElementById('probs').innerHTML='<tr><th>粗档</th><th>模型读数（非总体概率）</th></tr>'+p.map((x,i)=>'<tr><td>'+labels[i]+'</td><td>'+(100*x).toFixed(1)+'%</td></tr>').join('')}document.getElementById('go').onclick=render;render()</script>
