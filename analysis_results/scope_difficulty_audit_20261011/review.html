 <div>旧视觉类：${esc(r.previous_visual_class||'无')}；旧工作类：${esc(r.previous_working_class||'无')} → 本轮：${esc(r.current_class)}<br>原GT N/H：${esc(r.previous_N??'—')}/${esc(r.previous_H??'—')}；新底面点/转折/H：${f.N_floor}/${f.N_turn}/${f.H}；环序：${esc(f.ring_class)}<br>既有OOS：${esc(r.oos_subtype)}；门洞：${esc(r.doorway_status)}（未知/旧状态不因范围确认而自动消除）</div>
 <a href="${esc(r.evidence_card)}" target="_blank"><img class="evidence" src="${esc(r.evidence_card)}" alt="${esc(r.image)} 照片与新旧底面对照"></a>
 <p><b>我的判断依据：</b>${esc(r.visible_evidence)}</p>${r.question?`<p class="question"><b>请你裁定：</b>${esc(r.question)}</p>`:'<p>本轮未发现需要额外裁定的难度疑点；顶边坐标仍未正式确认。</p>'}
 <div class="grid"><div class="box"><b>你上次的审核</b><div>${prior(r.previous_user_review)}</div></div><div class="box"><b>另一位审核者的结论</b><div>${prior(r.external_review)}</div></div></div>
 <p><label>本次意见 <select data-image="${esc(r.image)}" data-field="grade">${['未审','认可本次建议','简单','中等','困难','特殊单列','仍不确定'].map(v=>`<option ${d.grade===v?'selected':''}>${v}</option>`).join('')}</select></label></p>
 <label>裁定说明（如门洞/玻璃/停止边/顶边对应）<br><textarea data-image="${esc(r.image)}" data-field="note">${esc(d.note||'')}</textarea></label></article>`}).join('');
 document.getElementById('status').textContent=`显示${shown.length}张；本地已填写${Object.keys(draft).length}张`;
}
document.getElementById('cards').addEventListener('change',e=>{const code=e.target.dataset.image;if(!code)return;const r=data.find(r=>r.image===code);draft[code]={...draft[code],image:code,image_id:r.image_id,reference_id:r.reference_id,proposed_class:r.current_class,grade:draft[code]?.grade||'未审',note:draft[code]?.note||'',[e.target.dataset.field]:e.target.value,updated_at:new Date().toISOString()};try{localStorage.setItem(key,JSON.stringify(draft));document.getElementById('status').textContent=`草稿已保存${Object.keys(draft).length}张`}catch(e){document.getElementById('status').textContent='无法本地保存，请立即导出。'}});
document.getElementById('filter').addEventListener('change',render);document.getElementById('search').addEventListener('input',render);
document.getElementById('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({schema:'scope_conditioned_difficulty_user_review_v1',review_version:version,exported_at:new Date().toISOString(),records:Object.values(draft)},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='新范围难度复核.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
render();
</script></html>
