<section class="panel recheckPanel"><h2 id="recheckStatus">T30独立复审：参考待补充</h2><p>原始“两者均不匹配／另一种空间”保留不改。以下是补充参考后的新层，不写正式GT或分数。</p><p id="recheckPreparation"></p><label>复审状态<select id="recheckState"><option value="reference_pending">参考待补充</option><option value="ready_for_rereview">已补参考，待复审</option><option value="reviewed">已人工复审</option><option value="uncertain">仍无法判断</option></select></label><label>新增判断<select id="recheckVerdict"><option value="">尚未填写</option><option value="matches_selected">可匹配所选合理底面</option><option value="none_match_confirmed">四个已确认底面均不匹配</option><option value="uncertain">无法判断</option></select></label><label>所选空间（可多选；空/未确认空间不可选）<select id="recheckTargets" multiple size="4"></select></label><label>主要原因 / 参考或目标疑问<textarea id="recheckReason" maxlength="2000"></textarea></label><label>信心<select id="recheckConfidence"><option value="">未填写</option><option>低</option><option>中</option><option>高</option></select></label><button id="saveRecheck">保存独立复审（不覆盖原回答）</button></section>
