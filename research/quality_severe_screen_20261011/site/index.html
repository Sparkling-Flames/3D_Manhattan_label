<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>严重错误 · 批量筛选</title><link rel="stylesheet" href="style.css"><body><header><div><small>质量校准 · 人工筛选</small><h1>只标出严重与犹豫</h1></div><div class="actions"><span id="counts"></span><button id="save">保存结果</button><label class="import">恢复结果<input type="file" id="import" accept=".json"></label></div></header><main><section class="intro"><p>每份只选一个：<b>严重错误</b>，或 <b>犹豫（明显 ↔ 严重）</b>。再次点击取消。无须写理由、无须逐题确认。</p><p>绿色为参考，橙色为作答。未标记不代表合格。进度自动保存在此浏览器；结束时点“保存结果”，把导出的 JSON 发回对话。</p><p class="warning">部分历史作答没有核定连线：其三维仅为自动配对辅助预览，已逐题标明。请同时看原始点位，不要仅凭辅助连线判严重。</p><div class="nav"><button id="prev">上一批</button><span id="page"></span><button id="next">下一批</button><select id="filter"><option value="all">全部作答</option><option value="selected">已勾选</option></select></div></section><div id="cards"></div><div class="bottom"><button id="next2">下一批 →</button></div></main><div role="dialog" aria-modal="true" id="lightbox" hidden><button id="close">关闭 ×</button><img id="large" alt="放大视图"></div><script src="app.js"></script></body></html>
