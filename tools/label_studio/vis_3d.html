<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>3D 布局预览</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #111;
        color: white;
        font-family: sans-serif;
      }

      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.55);
        padding: 6px 10px;
        border-radius: 4px;
        z-index: 20;
      }

      #controls {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 30;
        display: none !important;
        flex-direction: column;
        gap: 0;
        width: 248px;
        background: rgba(0, 0, 0, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
      }

      #controls.collapsed #controls-body {
        display: none;
      }

      #controls-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.06);
        cursor: move;
        user-select: none;
      }

      #controls-title {
        font-size: 12px;
        font-weight: 700;
        color: #f4f4f4;
      }

      #controls-header .mini-btn {
        appearance: none;
        border: 0;
        border-radius: 6px;
        padding: 4px 8px;
        color: white;
        background: rgba(255, 255, 255, 0.14);
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
      }

      #controls-body {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
      }

      #controls .row {
        display: flex;
        gap: 5px;
        align-items: center;
        flex-wrap: wrap;
      }

      #controls .status {
        font-size: 11px;
        color: #ddd;
        line-height: 1.35;
      }

      #controls .hint {
        color: #c8d5ff;
      }

      #controls .field-label {
        font-size: 11px;
        color: #ddd;
      }

      #controls input[type="number"] {
        width: 58px;
        padding: 4px 6px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.08);
        color: white;
        font-size: 11px;
      }

      #controls button {
        appearance: none;
        border: 0;
        border-radius: 6px;
        padding: 5px 9px;
        color: white;
        background: #2f5cff;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
      }

      #controls button.secondary {
        background: #555;
      }

      #controls button.warn {
        background: #bd3e3e;
      }

      #controls button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      #inspection-hud {
        display: none;
        position: absolute;
        right: 12px;
        top: 12px;
        z-index: 35;
        max-width: 330px;
        padding: 9px 11px;
        border: 1px solid rgba(96, 165, 250, 0.55);
        border-radius: 8px;
        background: rgba(8, 15, 30, 0.88);
        color: #e5e7eb;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
        white-space: pre-wrap;
        pointer-events: none;
      }
    </style>
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
  </head>
  <body>
    <div id="info">状态：就绪（拖动旋转，滚轮缩放）</div>
    <div id="inspection-hud">Inspector ready</div>
    <div id="controls">
      <div id="controls-header">
        <div id="controls-title">高级</div>
        <button id="toggle-panel" class="mini-btn" type="button">收起</button>
      </div>
      <div id="controls-body">
        <div class="status hint">只影响右侧 3D 预览，不会修改主标注数据。</div>
        <div class="status hint">先定位当前对，再用“交换到第 N 对”直接调整顺序。</div>
        <div class="status" id="pair-status">当前对：-- / --</div>
        <div class="row">
          <span class="field-label">定位到</span>
          <input id="pair-input" type="number" min="1" step="1" value="1" />
          <span class="field-label">/ <span id="pair-total">--</span></span>
        </div>
        <div class="row">
          <span class="field-label">交换到</span>
          <input id="swap-target-input" type="number" min="1" step="1" value="1" />
          <span class="field-label">对</span>
          <button id="swap-target-run" class="secondary">执行交换</button>
        </div>
        <div class="row">
          <button id="pair-prev" class="secondary">上一对</button>
          <button id="pair-next" class="secondary">下一对</button>
        </div>
        <div class="row">
          <button id="swap-prev" class="secondary">与前交换</button>
          <button id="swap-next" class="secondary">与后交换</button>
        </div>
        <div class="row">
          <button id="save-order">保存</button>
          <button id="clear-order" class="warn">清除</button>
        </div>
        <div class="status" id="override-status">预览顺序覆盖：未启用</div>
      </div>
    </div>
    <script>
      const PANEL_POSITION_KEY = "hohonet_preview_panel_position_v1";
      const PANEL_COLLAPSED_KEY = "hohonet_preview_panel_collapsed_v1";
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111111);

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = false;
      controls.minDistance = 0.1;
      controls.maxDistance = 50;

      const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
      gridHelper.position.y = -1.6;
      gridHelper.visible = false;
      scene.add(gridHelper);

      const axesHelper = new THREE.AxesHelper(2);
      axesHelper.visible = false;
      scene.add(axesHelper);

      let meshObjects = [];
      let W = 1024;
      let H = 512;
      let currentTexture = null;
      let currentTextureUrl = null;
      let cornerLabelsVisible = true;
      const CORNER_RADIUS = 0.065;
      const CHANGED_CORNER_RADIUS = 0.08;
      const SELECTED_CORNER_RADIUS = 0.10;
      const CORNER_OPACITY = 0.55;
      const CHANGED_CORNER_OPACITY = 0.65;
      const SELECTED_CORNER_OPACITY = 0.70;
      const HIDDEN_CORNER_OPACITY = 0.05;
      const HIDDEN_CORNER_COLOR = 0xe2e8f0;
      const textureLoader = new THREE.TextureLoader();
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let interactiveObjects = [];
      let selectionObjects = [];
      let measurementObjects = [];
      let inspectionGeometry = null;
      let pointerDownPosition = null;
      const inspectionState = {
        enabled: false,
        variantName: "",
        metadata: null,
        ghostCorners: null,
        changedPairIndices: [],
        changedWallIndices: [],
        displayOptions: { ghost: false, measureMode: false, texture: true },
        measurementPoints: [],
      };

      const previewState = {
        baseCorners: [],
        currentOrder: [],
        savedOrder: null,
        currentSignature: "",
        selectedPairIndex: 0,
        imageUrl: null,
        savedOverrideActive: false,
      };
      const previewInputState = {
        pairDirty: false,
        swapDirty: false,
        swapInitialized: false,
      };

      function resetPreviewInputState() {
        previewInputState.pairDirty = false;
        previewInputState.swapDirty = false;
        previewInputState.swapInitialized = false;
      }

      const panoMaterial = new THREE.ShaderMaterial({
        uniforms: {
          map: { value: null },
        },
        vertexShader: `
          varying vec3 vWorldPosition;
          void main() {
            vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D map;
          varying vec3 vWorldPosition;
          const float PI = 3.14159265359;

          void main() {
            vec3 dir = normalize(vWorldPosition);
            float u = atan(dir.x, -dir.z) / (2.0 * PI) + 0.5;
            float v = asin(dir.y) / PI + 0.5;
            gl_FragColor = texture2D(map, vec2(u, v));
          }
        `,
        side: THREE.DoubleSide,
      });

      function updateStatus(msg) {
        document.getElementById("info").innerText = "状态：" + msg;
      }

      function updateControlPanelStatus(msg) {
        const node = document.getElementById("override-status");
        if (node) {
          node.innerText = msg;
        }
      }

      function postPreviewState(statusText) {
        const length = previewState.baseCorners.length;
        window.parent.postMessage(
          {
            type: "hohonet_preview_order_state",
            hasData: length > 0,
            pairCount: length,
            selectedPairIndex: length > 0 ? previewState.selectedPairIndex : 0,
            selectedPairNumber:
              length > 0 ? previewState.selectedPairIndex + 1 : 0,
            savedOverrideActive: !!previewState.savedOverrideActive,
            previewOrder: Array.isArray(previewState.currentOrder)
              ? previewState.currentOrder.slice()
              : [],
            previewSignature: previewState.currentSignature || "",
            statusText: statusText || "",
          },
          "*"
        );
      }

      function loadPanelPosition() {
        try {
          const raw = window.localStorage.getItem(PANEL_POSITION_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (
            !parsed ||
            typeof parsed !== "object" ||
            !Number.isFinite(parsed.left) ||
            !Number.isFinite(parsed.top)
          ) {
            return null;
          }
          return parsed;
        } catch (error) {
          return null;
        }
      }

      function savePanelPosition(left, top) {
        try {
          window.localStorage.setItem(
            PANEL_POSITION_KEY,
            JSON.stringify({ left, top })
          );
        } catch (error) {}
      }

      function clampPanelPosition(left, top) {
        const panel = document.getElementById("controls");
        const panelWidth = panel ? panel.offsetWidth || 248 : 248;
        const panelHeight = panel ? panel.offsetHeight || 180 : 180;
        const maxLeft = Math.max(8, window.innerWidth - panelWidth - 8);
        const maxTop = Math.max(8, window.innerHeight - panelHeight - 8);
        return {
          left: Math.min(Math.max(8, left), maxLeft),
          top: Math.min(Math.max(8, top), maxTop),
        };
      }

      function applyPanelPosition(left, top, persist = false) {
        const panel = document.getElementById("controls");
        if (!panel) return;
        const clamped = clampPanelPosition(left, top);
        panel.style.left = `${clamped.left}px`;
        panel.style.top = `${clamped.top}px`;
        if (persist) savePanelPosition(clamped.left, clamped.top);
      }

      function initializePanelPosition() {
        const stored = loadPanelPosition();
        if (stored) {
          applyPanelPosition(stored.left, stored.top, false);
          return;
        }
        const panel = document.getElementById("controls");
        const defaultLeft = Math.max(12, window.innerWidth - (panel.offsetWidth || 248) - 12);
        const defaultTop = 12;
        applyPanelPosition(defaultLeft, defaultTop, false);
      }

      function setPanelCollapsed(collapsed, persist = true) {
        const panel = document.getElementById("controls");
        const toggleBtn = document.getElementById("toggle-panel");
        if (!panel || !toggleBtn) return;
        panel.classList.toggle("collapsed", collapsed);
        toggleBtn.innerText = collapsed ? "展开" : "收起";
        if (persist) {
          try {
            window.localStorage.setItem(PANEL_COLLAPSED_KEY, collapsed ? "1" : "0");
          } catch (error) {}
        }
      }

      function initializePanelCollapseState() {
        let collapsed = true;
        try {
          const stored = window.localStorage.getItem(PANEL_COLLAPSED_KEY);
          collapsed = stored === null ? true : stored === "1";
        } catch (error) {}
        setPanelCollapsed(collapsed, false);
      }

      function initializePanelDrag() {
        const panel = document.getElementById("controls");
        const header = document.getElementById("controls-header");
        if (!panel || !header) return;

        let dragging = false;
        let offsetX = 0;
        let offsetY = 0;

        header.addEventListener("pointerdown", (event) => {
          if (event.target.closest("button")) return;
          dragging = true;
          const rect = panel.getBoundingClientRect();
          offsetX = event.clientX - rect.left;
          offsetY = event.clientY - rect.top;
          header.setPointerCapture(event.pointerId);
          event.preventDefault();
        });

        header.addEventListener("pointermove", (event) => {
          if (!dragging) return;
          applyPanelPosition(event.clientX - offsetX, event.clientY - offsetY, false);
        });

        const stopDragging = (event) => {
          if (!dragging) return;
          dragging = false;
          const rect = panel.getBoundingClientRect();
          savePanelPosition(rect.left, rect.top);
          if (event && header.hasPointerCapture(event.pointerId)) {
            header.releasePointerCapture(event.pointerId);
          }
        };

        header.addEventListener("pointerup", stopDragging);
        header.addEventListener("pointercancel", stopDragging);
      }

      function makeTextSprite(message) {
        const canvas = document.createElement("canvas");
        const size = 64;
        canvas.width = size;
        canvas.height = size;
        const context = canvas.getContext("2d");

        context.beginPath();
        context.arc(size / 2, size / 2, size / 2 - 2, 0, 2 * Math.PI, false);
        context.fillStyle = "rgba(255, 255, 0, 1)";
        context.fill();
        context.lineWidth = 4;
        context.strokeStyle = "black";
        context.stroke();

        context.font = "bold 32px Arial";
        context.fillStyle = "black";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(message, size / 2, size / 2);

        const texture = new THREE.Texture(canvas);
        texture.needsUpdate = true;
        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          depthTest: false,
        });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(0.5, 0.5, 0.5);
        sprite.renderOrder = 999;
        sprite.userData.hohonetCornerLabel = true;
        sprite.visible = cornerLabelsVisible;
        return sprite;
      }

      function setCornerLabelVisibility(visible) {
        cornerLabelsVisible = Boolean(visible);
        [...meshObjects, ...selectionObjects].forEach((object) => {
          if (object?.userData?.hohonetCornerLabel === true) {
            object.visible = cornerLabelsVisible;
          }
          if (
            object?.userData?.hohonetCornerMarker === true
            && object.material
          ) {
            object.material.opacity = cornerLabelsVisible
              ? object.userData.hohonetBaseOpacity
              : HIDDEN_CORNER_OPACITY;
            object.material.color.setHex(
              cornerLabelsVisible
                ? object.userData.hohonetBaseColor
                : HIDDEN_CORNER_COLOR
            );
            object.material.needsUpdate = true;
          }
        });
      }

      function cloneCorner(corner) {
        return {
          x: Number(corner.x),
          y_ceiling: Number(corner.y_ceiling),
          y_floor: Number(corner.y_floor),
          originalPoints: Array.isArray(corner.originalPoints)
            ? corner.originalPoints.map((point) => ({
                x: Number(point.x),
                y: Number(point.y),
                pctX:
                  point.pctX === undefined ? undefined : Number(point.pctX),
                pctY:
                  point.pctY === undefined ? undefined : Number(point.pctY),
              }))
            : [],
        };
      }

      function cloneCorners(corners) {
        return Array.isArray(corners) ? corners.map(cloneCorner) : [];
      }

      function getIdentityOrder(length) {
        return Array.from({ length }, (_, idx) => idx);
      }

      function normalizeOrder(order, length) {
        if (!Array.isArray(order) || order.length !== length) return null;
        const seen = new Set();
        const normalized = [];
        for (const rawIdx of order) {
          const idx = Number(rawIdx);
          if (!Number.isInteger(idx) || idx < 0 || idx >= length || seen.has(idx)) {
            return null;
          }
          seen.add(idx);
          normalized.push(idx);
        }
        return normalized;
      }

      function ordersEqual(a, b) {
        if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) {
          return false;
        }
        for (let i = 0; i < a.length; i += 1) {
          if (Number(a[i]) !== Number(b[i])) return false;
        }
        return true;
      }

      function applyOrderToCorners(baseCorners, order) {
        const normalized = normalizeOrder(order, baseCorners.length);
        if (!normalized) return cloneCorners(baseCorners);
        return normalized.map((idx) => cloneCorner(baseCorners[idx]));
      }

      function clampSelectedPairIndex() {
        const length = previewState.baseCorners.length;
        if (!length) {
          previewState.selectedPairIndex = 0;
          return;
        }
        previewState.selectedPairIndex = Math.max(
          0,
          Math.min(previewState.selectedPairIndex, length - 1)
        );
      }

      function applyPreviewStateSnapshot({
        baseCorners = [],
        currentOrder = [],
        savedOrder = null,
        currentSignature = "",
        imageUrl = null,
        savedOverrideActive = false,
        selectedPairIndex = 0,
      } = {}) {
        previewState.baseCorners = cloneCorners(baseCorners);
        previewState.currentOrder = Array.isArray(currentOrder)
          ? currentOrder.slice()
          : [];
        previewState.savedOrder = Array.isArray(savedOrder)
          ? savedOrder.slice()
          : null;
        previewState.currentSignature = String(currentSignature || "");
        previewState.imageUrl = imageUrl || null;
        previewState.savedOverrideActive = !!savedOverrideActive;
        previewState.selectedPairIndex = Number(selectedPairIndex) || 0;
        resetPreviewInputState();
      }

      function moveSelection(delta) {
        const length = previewState.baseCorners.length;
        if (!length || !Number.isFinite(delta) || delta === 0) {
          updateControlState();
          return;
        }
        previewState.selectedPairIndex = Math.max(
          0,
          Math.min(previewState.selectedPairIndex + delta, length - 1)
        );
        updateControlState();
      }

      function renderCurrentPreview(message, options = {}) {
        clampSelectedPairIndex();
        const corners = applyOrderToCorners(
          previewState.baseCorners,
          previewState.currentOrder
        );
        drawLayout(corners, previewState.imageUrl, {
          preserveOrder: true,
          resetView: !!options.resetView,
        });
        updateControlState(message);
      }

      function updateControlState(message) {
        const length = previewState.baseCorners.length;
        clampSelectedPairIndex();
        const identityOrder = getIdentityOrder(length);
        const isDefaultPreview = ordersEqual(previewState.currentOrder, identityOrder);
        const isSavedPreview =
          previewState.savedOverrideActive &&
          Array.isArray(previewState.savedOrder) &&
          ordersEqual(previewState.currentOrder, previewState.savedOrder);

        const pairStatus =
          length > 0
            ? `当前第 ${previewState.selectedPairIndex + 1} / ${length} 对`
            : "当前第 -- / -- 对";
        const pairStatusNode = document.getElementById("pair-status");
        const pairTotalNode = document.getElementById("pair-total");
        const pairInputNode = document.getElementById("pair-input");
        if (pairStatusNode) pairStatusNode.innerText = pairStatus;
        if (pairTotalNode) {
          pairTotalNode.innerText = length > 0 ? String(length) : "--";
        }
        if (
          pairInputNode &&
          document.activeElement !== pairInputNode &&
          !previewInputState.pairDirty
        ) {
          pairInputNode.value =
            length > 0 ? String(previewState.selectedPairIndex + 1) : "1";
        }

        const hasData = length > 0;
        const swapTargetInput = document.getElementById("swap-target-input");
        const swapTargetRunNode = document.getElementById("swap-target-run");
        const pairPrevNode = document.getElementById("pair-prev");
        const pairNextNode = document.getElementById("pair-next");
        const swapPrevNode = document.getElementById("swap-prev");
        const swapNextNode = document.getElementById("swap-next");
        const saveOrderNode = document.getElementById("save-order");
        const clearOrderNode = document.getElementById("clear-order");

        if (pairInputNode) pairInputNode.disabled = !hasData;
        if (swapTargetInput) swapTargetInput.disabled = !hasData;
        if (swapTargetRunNode) swapTargetRunNode.disabled = !hasData;
        if (pairPrevNode) {
          pairPrevNode.disabled = !hasData || previewState.selectedPairIndex === 0;
        }
        if (pairNextNode) {
          pairNextNode.disabled =
            !hasData || previewState.selectedPairIndex >= length - 1;
        }
        if (swapPrevNode) {
          swapPrevNode.disabled = !hasData || previewState.selectedPairIndex === 0;
        }
        if (swapNextNode) {
          swapNextNode.disabled =
            !hasData || previewState.selectedPairIndex >= length - 1;
        }
        if (saveOrderNode) saveOrderNode.disabled = !hasData;
        if (clearOrderNode) clearOrderNode.disabled = !hasData;

        if (
          swapTargetInput &&
          !swapTargetInput.matches(":focus") &&
          !previewInputState.swapDirty &&
          !previewInputState.swapInitialized
        ) {
          const suggestedTarget =
            length > 1 ? Math.min(length, previewState.selectedPairIndex + 2) : 1;
          swapTargetInput.value = String(suggestedTarget);
          previewInputState.swapInitialized = true;
        }

        const cacheStatus = previewState.savedOverrideActive
          ? "本地缓存：有"
          : "本地缓存：无";
        const previewStatus = isSavedPreview
          ? "当前预览：已保存顺序"
          : isDefaultPreview
            ? "当前预览：默认顺序"
            : "当前预览：临时调整";
        let overrideStatus = `${cacheStatus} | ${previewStatus}`;
        if (message) {
          overrideStatus += ` | ${message}`;
        }
        updateControlPanelStatus(overrideStatus);
        postPreviewState(overrideStatus);
      }

      function swapWithPrevious() {
        if (previewState.selectedPairIndex <= 0) return;
        const order = previewState.currentOrder.slice();
        const idx = previewState.selectedPairIndex;
        [order[idx - 1], order[idx]] = [order[idx], order[idx - 1]];
        previewState.currentOrder = order;
        previewState.selectedPairIndex = idx - 1;
        renderCurrentPreview(`已将第 ${idx + 1} 对与第 ${idx} 对交换`);
      }

      function swapWithNext() {
        const length = previewState.currentOrder.length;
        const idx = previewState.selectedPairIndex;
        if (!length || idx >= length - 1) return;
        const order = previewState.currentOrder.slice();
        [order[idx], order[idx + 1]] = [order[idx + 1], order[idx]];
        previewState.currentOrder = order;
        previewState.selectedPairIndex = idx + 1;
        renderCurrentPreview(`已将第 ${idx + 1} 对与第 ${idx + 2} 对交换`);
      }

      function saveCurrentOverride() {
        if (!previewState.baseCorners.length) return;
        previewState.savedOverrideActive = true;
        previewState.savedOrder = previewState.currentOrder.slice();
        updateControlState("已保存到本地缓存");
        window.parent.postMessage(
          {
            type: "hohonet_preview_order_save",
            previewOrder: previewState.currentOrder.slice(),
            previewSignature: previewState.currentSignature,
          },
          "*"
        );
      }

      function resetPreviewToDefault() {
        if (!previewState.baseCorners.length) return;
        previewState.currentOrder = getIdentityOrder(previewState.baseCorners.length);
        renderCurrentPreview("已恢复当前预览到默认顺序");
      }

      function deleteSavedOverride() {
        if (!previewState.baseCorners.length) return;
        previewState.savedOrder = null;
        previewState.savedOverrideActive = false;
        previewState.currentOrder = getIdentityOrder(previewState.baseCorners.length);
        renderCurrentPreview("已删除当前缓存并恢复默认顺序");
        window.parent.postMessage(
          {
            type: "hohonet_preview_order_delete_saved",
            previewSignature: previewState.currentSignature,
          },
          "*"
        );
      }

      function clearCurrentOverride() {
        deleteSavedOverride();
      }

      function setSelectedPairIndex(rawValue = null) {
        const input = document.getElementById("pair-input");
        const length = previewState.baseCorners.length;
        if (!length) return;
        const nextValue =
          rawValue === null || rawValue === undefined
            ? Number(input ? input.value : NaN)
            : Number(rawValue);
        if (!Number.isInteger(nextValue)) {
          if (input) {
            input.value = String(previewState.selectedPairIndex + 1);
          }
          return;
        }
        const nextIndex = Math.max(1, Math.min(length, nextValue)) - 1;
        previewState.selectedPairIndex = nextIndex;
        updateControlState(`已定位到第 ${nextIndex + 1} 对`);
      }

      function swapWithTargetIndex(rawValue = null) {
        const input = document.getElementById("swap-target-input");
        const length = previewState.currentOrder.length;
        if (!length) return;
        const nextValue =
          rawValue === null || rawValue === undefined
            ? Number(input ? input.value : NaN)
            : Number(rawValue);
        if (!Number.isInteger(nextValue)) {
          updateControlState("目标编号无效");
          return;
        }
        const targetIndex = Math.max(1, Math.min(length, nextValue)) - 1;
        const currentIndex = previewState.selectedPairIndex;
        if (targetIndex === currentIndex) {
          updateControlState(`当前已是第 ${targetIndex + 1} 对`);
          return;
        }
        const order = previewState.currentOrder.slice();
        [order[currentIndex], order[targetIndex]] = [order[targetIndex], order[currentIndex]];
        previewState.currentOrder = order;
        previewState.selectedPairIndex = targetIndex;
        renderCurrentPreview(
          `已将第 ${currentIndex + 1} 对与第 ${targetIndex + 1} 对交换`
        );
      }

      function applyPreviewOrderCommand(action, data = {}) {
        action = String(action || "");
        if (!action) return;

        if (action === "set_pair") {
          setSelectedPairIndex(data.index);
          return;
        }
        if (action === "prev_pair") {
          moveSelection(-1);
          return;
        }
        if (action === "next_pair") {
          moveSelection(1);
          return;
        }
        if (action === "swap_prev") {
          swapWithPrevious();
          return;
        }
        if (action === "swap_next") {
          swapWithNext();
          return;
        }
        if (action === "swap_target") {
          swapWithTargetIndex(data.index);
          return;
        }
        if (action === "save") {
          saveCurrentOverride();
          return;
        }
        if (action === "reset_default_order") {
          resetPreviewToDefault();
          return;
        }
        if (action === "delete_saved_override") {
          deleteSavedOverride();
          return;
        }
        if (action === "clear") {
          clearCurrentOverride();
        }
      }

      function handlePreviewOrderCommand(data) {
        applyPreviewOrderCommand(data.action, data);
      }

      function handlePreviewOrderAck(data) {
        if (data.ok) {
          if (data.action === "save") {
            previewState.savedOrder = previewState.currentOrder.slice();
            previewState.savedOverrideActive = true;
            updateControlState("保存成功：本地缓存已更新");
          } else if (
            data.action === "clear" ||
            data.action === "delete_saved"
          ) {
            previewState.savedOrder = null;
            previewState.savedOverrideActive = false;
            updateControlState("删除成功：已恢复默认顺序");
          }
        } else {
          updateControlState("本地缓存操作失败");
        }
      }

      function applyPairSelectionFromInput() {
        previewInputState.pairDirty = false;
        applyPreviewOrderCommand("set_pair");
      }

      function syncSelectionFromPairInput() {
        const input = document.getElementById("pair-input");
        if (!input || !previewState.baseCorners.length) return;
        const desired = Number(input.value);
        if (!Number.isInteger(desired)) return;
        const current = previewState.selectedPairIndex + 1;
        if (desired !== current) {
          previewInputState.pairDirty = false;
          setSelectedPairIndex(desired);
        }
      }

      function runLocalSwapTarget() {
        const input = document.getElementById("swap-target-input");
        const targetValue = Number(input ? input.value : NaN);
        previewInputState.swapDirty = false;
        previewInputState.swapInitialized = true;
        syncSelectionFromPairInput();
        applyPreviewOrderCommand("swap_target", { index: targetValue });
      }

      document.getElementById("pair-input").addEventListener("input", () => {
        previewInputState.pairDirty = true;
      });
      document.getElementById("swap-target-input").addEventListener("input", () => {
        previewInputState.swapDirty = true;
        previewInputState.swapInitialized = true;
      });

      document.getElementById("pair-prev").addEventListener("click", () => {
        syncSelectionFromPairInput();
        previewInputState.pairDirty = false;
        applyPreviewOrderCommand("prev_pair");
      });

      document.getElementById("pair-next").addEventListener("click", () => {
        syncSelectionFromPairInput();
        previewInputState.pairDirty = false;
        applyPreviewOrderCommand("next_pair");
      });

      document.getElementById("pair-input").addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          applyPairSelectionFromInput();
        }
      });
      document.getElementById("pair-input").addEventListener("change", applyPairSelectionFromInput);
      document.getElementById("swap-target-run").addEventListener("click", runLocalSwapTarget);
      document.getElementById("swap-target-input").addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          runLocalSwapTarget();
        }
      });

      document.getElementById("swap-prev").addEventListener("click", () => {
        syncSelectionFromPairInput();
        previewInputState.swapDirty = false;
        applyPreviewOrderCommand("swap_prev");
      });
      document.getElementById("swap-next").addEventListener("click", () => {
        syncSelectionFromPairInput();
        previewInputState.swapDirty = false;
        applyPreviewOrderCommand("swap_next");
      });
      document.getElementById("save-order").addEventListener("click", saveCurrentOverride);
      document.getElementById("clear-order").addEventListener("click", clearCurrentOverride);
      document.getElementById("toggle-panel").addEventListener("click", (event) => {
        event.stopPropagation();
        const panel = document.getElementById("controls");
        setPanelCollapsed(!panel.classList.contains("collapsed"), true);
      });

      function removeSceneObjects(objects) {
        objects.forEach((object) => {
          scene.remove(object);
          object.geometry?.dispose?.();
          if (Array.isArray(object.material)) {
            object.material.forEach((material) => material?.dispose?.());
          } else {
            object.material?.dispose?.();
          }
        });
        objects.length = 0;
      }

      function clearInspectionSelection() {
        removeSceneObjects(selectionObjects);
        const hud = document.getElementById("inspection-hud");
        if (hud && inspectionState.enabled) hud.innerText = "Click a corner or wall.";
      }

      function clearMeasurement() {
        inspectionState.measurementPoints = [];
        removeSceneObjects(measurementObjects);
        if (inspectionState.enabled) {
          window.parent.postMessage(
            { type: "hohonet_measurement_status", measurement: { status: "cleared" } },
            "*"
          );
        }
      }

      function pairMetadata(pairIndex) {
        return inspectionState.metadata?.pairs?.find(
          (row) => Number(row.effective_pair_index) === Number(pairIndex)
        ) || null;
      }

      function wallMetadata(wallIndex) {
        return inspectionState.metadata?.walls?.find(
          (row) => Number(row.wall_index) === Number(wallIndex)
        ) || null;
      }

      function compactNumber(value) {
        return Number.isFinite(Number(value)) ? Number(value).toFixed(3) : "--";
      }

      function showInspectionHud(selection) {
        const hud = document.getElementById("inspection-hud");
        if (!hud || !inspectionState.enabled) return;
        if (selection.type === "corner") {
          const point = selection.coordinates_3d || {};
          hud.innerText = [
            `Corner ${selection.pair_index} · ${selection.endpoint}`,
            `3D: (${compactNumber(point.x)}, ${compactNumber(point.y)}, ${compactNumber(point.z)})`,
            `wall height: ${compactNumber(selection.wall_height)}`,
            `height residual: ${compactNumber(selection.height_residual)}`,
            `walls: ${selection.previous_wall_index} ↔ ${selection.next_wall_index}`,
            `wall-to-wall angle: ${compactNumber(selection.junction_angle_deg)}°`,
            `deviation from 90°: ${compactNumber(selection.junction_residual_to_90_deg)}°`,
          ].join("\n");
        } else if (selection.type === "wall") {
          hud.innerText = [
            `Wall ${selection.wall_index} · ${selection.from_pair} → ${selection.to_pair}`,
            `length: ${compactNumber(selection.floor_wall_length)}`,
            `heading (global XZ): ${compactNumber(selection.wall_heading_deg)}°`,
            `nearest axis heading: ${compactNumber(selection.nearest_axis_heading_deg)}°`,
            `deviation from axis: ${compactNumber(selection.axis_deviation_deg)}°`,
            `short wall: ${selection.short_wall ? "yes" : "no"}`,
          ].join("\n");
        } else {
          hud.innerText = JSON.stringify(selection, null, 2);
        }
      }

      function postGeometrySelection(selection) {
        showInspectionHud(selection);
        window.parent.postMessage(
          {
            type: "hohonet_geometry_selection",
            variantName: inspectionState.variantName,
            selection,
          },
          "*"
        );
      }

      function addCornerAngleGuide(pairIndex, endpoint) {
        if (!inspectionGeometry) return;
        const count = inspectionState.metadata?.pairs?.length || 0;
        if (count < 3) return;
        const points = endpoint === "ceiling"
          ? inspectionGeometry.ceilPoints
          : inspectionGeometry.floorPoints;
        const index = Number(pairIndex) - 1;
        const center = points[index];
        const previous = points[(index - 1 + count) % count];
        const next = points[(index + 1) % count];
        if (!center || !previous || !next) return;

        const previousDirection = previous.clone().sub(center);
        const nextDirection = next.clone().sub(center);
        previousDirection.y = 0;
        nextDirection.y = 0;
        const previousLength = previousDirection.length();
        const nextLength = nextDirection.length();
        if (previousLength <= 1e-9 || nextLength <= 1e-9) return;
        previousDirection.normalize();
        nextDirection.normalize();
        const radius = Math.max(0.18, Math.min(0.75, Math.min(previousLength, nextLength) * 0.28));
        const raisedCenter = center.clone().add(new THREE.Vector3(0, 0.025, 0));
        const previousRayEnd = raisedCenter.clone().add(previousDirection.clone().multiplyScalar(radius));
        const nextRayEnd = raisedCenter.clone().add(nextDirection.clone().multiplyScalar(radius));
        const rayGeometry = new THREE.BufferGeometry().setFromPoints([
          raisedCenter, previousRayEnd, raisedCenter, nextRayEnd,
        ]);
        const rayLine = new THREE.LineSegments(
          rayGeometry,
          new THREE.LineBasicMaterial({ color: 0x38bdf8, depthTest: false })
        );
        rayLine.renderOrder = 52;
        scene.add(rayLine);
        selectionObjects.push(rayLine);

        const startAngle = Math.atan2(previousDirection.z, previousDirection.x);
        const endAngle = Math.atan2(nextDirection.z, nextDirection.x);
        let delta = ((endAngle - startAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        const arcPoints = [];
        for (let step = 0; step <= 32; step += 1) {
          const angle = startAngle + delta * (step / 32);
          arcPoints.push(new THREE.Vector3(
            raisedCenter.x + Math.cos(angle) * radius,
            raisedCenter.y,
            raisedCenter.z + Math.sin(angle) * radius
          ));
        }
        const arcLine = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(arcPoints),
          new THREE.LineBasicMaterial({ color: 0xfacc15, depthTest: false })
        );
        arcLine.renderOrder = 53;
        scene.add(arcLine);
        selectionObjects.push(arcLine);
      }

      function addCornerSelection(point, pairIndex, endpoint) {
        clearInspectionSelection();
        const material = new THREE.MeshBasicMaterial({
          color: 0xfacc15, transparent: true, opacity: SELECTED_CORNER_OPACITY,
          depthTest: false,
        });
        const marker = new THREE.Mesh(
          new THREE.SphereGeometry(SELECTED_CORNER_RADIUS, 20, 20), material
        );
        marker.position.copy(point);
        marker.renderOrder = 50;
        marker.userData.hohonetCornerMarker = true;
        marker.userData.hohonetBaseOpacity = SELECTED_CORNER_OPACITY;
        marker.userData.hohonetBaseColor = marker.material.color.getHex();
        if (!cornerLabelsVisible) {
          marker.material.opacity = HIDDEN_CORNER_OPACITY;
          marker.material.color.setHex(HIDDEN_CORNER_COLOR);
        }
        scene.add(marker);
        selectionObjects.push(marker);
        addCornerAngleGuide(pairIndex, endpoint);
      }

      function addWallSelection(wallIndex) {
        clearInspectionSelection();
        if (!inspectionGeometry) return;
        const index = Number(wallIndex) - 1;
        const c1 = inspectionGeometry.ceilPoints[index];
        const f1 = inspectionGeometry.floorPoints[index];
        const c2 = inspectionGeometry.ceilPoints[index + 1];
        const f2 = inspectionGeometry.floorPoints[index + 1];
        if (!c1 || !f1 || !c2 || !f2) return;
        const geometry = new THREE.BufferGeometry().setFromPoints([
          c1, f1, f2, c2, c1,
        ]);
        const line = new THREE.Line(
          geometry,
          new THREE.LineBasicMaterial({ color: 0xfacc15, depthTest: false })
        );
        line.renderOrder = 50;
        scene.add(line);
        selectionObjects.push(line);
      }

      function selectCorner(pairIndex, endpoint, point) {
        const metadata = pairMetadata(pairIndex) || {};
        const selection = {
          type: "corner",
          pair_index: Number(pairIndex),
          source_preview_order_index: metadata.source_preview_order_index ?? null,
          endpoint,
          coordinates_3d: endpoint === "ceiling" ? metadata.ceiling_3d : metadata.floor_3d,
          input_coordinates: metadata.input || null,
          normalized_coordinates: metadata.normalized || null,
          wall_height: metadata.wall_height ?? null,
          height_residual: metadata.height_residual ?? null,
          local_height_residual: metadata.local_height_residual ?? null,
          previous_wall_index: metadata.previous_wall_index ?? null,
          next_wall_index: metadata.next_wall_index ?? null,
          junction_angle_deg: metadata.junction_angle_deg ?? null,
          junction_residual_to_90_deg: metadata.junction_residual_to_90_deg ?? null,
          junction_angle_kind: metadata.junction_angle_kind || "unsigned_smaller_floorprint_angle_0_180",
        };
        addCornerSelection(point, pairIndex, endpoint);
        postGeometrySelection(selection);
        if (inspectionState.displayOptions.measureMode) addMeasurementPoint(selection, point);
      }

      function selectWall(wallIndex) {
        const metric = wallMetadata(wallIndex) || {};
        const selection = {
          type: "wall",
          wall_index: Number(wallIndex),
          from_pair: metric.from_pair ?? null,
          to_pair: metric.to_pair ?? null,
          floor_wall_vector: metric.floor_wall_vector || null,
          floor_wall_length: metric.floor_wall_length ?? null,
          ceiling_wall_length: metric.ceiling_wall_length ?? null,
          length_ratio: metric.length_ratio ?? null,
          wall_heading_deg: metric.direction_deg ?? null,
          heading_reference: "global_xz_counterclockwise_from_positive_x",
          nearest_axis_heading_deg: metric.nearest_manhattan_axis_deg ?? null,
          axis_deviation_deg: metric.angle_residual_deg ?? null,
          angle_warning: !!metric.angle_warning,
          short_wall: !!metric.short_wall,
          short_wall_threshold: metric.short_wall_threshold ?? null,
        };
        addWallSelection(wallIndex);
        postGeometrySelection(selection);
      }

      function focusInspectionPoint(point) {
        if (!point) return;
        controls.target.copy(point);
        camera.lookAt(point);
        controls.update();
      }

      function addMeasurementPoint(selection, point) {
        if (inspectionState.measurementPoints.length >= 2) clearMeasurement();
        inspectionState.measurementPoints.push({ selection, point: point.clone() });
        if (inspectionState.measurementPoints.length < 2) {
          window.parent.postMessage(
            {
              type: "hohonet_measurement_status",
              measurement: { status: "waiting_for_second_point", first: selection },
            },
            "*"
          );
          return;
        }
        const [first, second] = inspectionState.measurementPoints;
        const delta = second.point.clone().sub(first.point);
        const line = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([first.point, second.point]),
          new THREE.LineDashedMaterial({ color: 0x22d3ee, dashSize: 0.12, gapSize: 0.06, depthTest: false })
        );
        line.computeLineDistances();
        line.renderOrder = 60;
        scene.add(line);
        measurementObjects.push(line);
        window.parent.postMessage(
          {
            type: "hohonet_measurement_status",
            measurement: {
              status: "complete",
              from: first.selection,
              to: second.selection,
              distance_3d: first.point.distanceTo(second.point),
              delta: { x: delta.x, y: delta.y, z: delta.z },
            },
          },
          "*"
        );
      }

      function geometryCenterAndRadius() {
        const points = [
          ...(inspectionGeometry?.ceilPoints || []),
          ...(inspectionGeometry?.floorPoints || []),
        ];
        if (!points.length) return { center: new THREE.Vector3(0, -1.6, 0), radius: 6 };
        const box = new THREE.Box3().setFromPoints(points);
        const center = box.getCenter(new THREE.Vector3());
        return { center, radius: Math.max(2, box.getSize(new THREE.Vector3()).length()) };
      }

      function applyCameraPreset(preset) {
        const { center, radius } = geometryCenterAndRadius();
        if (preset === "top") camera.position.set(center.x, center.y + radius, center.z + 0.001);
        else if (preset === "inside") camera.position.set(0, 0, 0);
        else if (preset === "isometric") camera.position.set(center.x + radius * 0.65, center.y + radius * 0.55, center.z + radius * 0.65);
        else camera.position.set(0, 8, 0);
        controls.target.copy(preset === "reset" ? new THREE.Vector3(0, -1.6, 0) : center);
        camera.lookAt(controls.target);
        controls.update();
      }

      function selectIssue(issue) {
        if (!issue) return;
        if (issue.type === "wall" && issue.wall_index) {
          selectWall(issue.wall_index);
          const index = Number(issue.wall_index) - 1;
          const floorPoints = inspectionGeometry?.floorPoints || [];
          const a = floorPoints[index];
          const b = floorPoints[index + 1];
          if (a && b) focusInspectionPoint(a.clone().add(b).multiplyScalar(0.5));
        }
        else if ((issue.type === "corner" || issue.type === "height") && issue.pair_index) {
          const pair = Number(issue.pair_index) - 1;
          const point = inspectionGeometry?.floorPoints?.[pair];
          if (point) {
            selectCorner(issue.pair_index, "floor", point);
            focusInspectionPoint(point);
          }
        } else postGeometrySelection({ type: "layout", ...issue });
      }

      function reportTextureStatus(status, hasTexture, imageUrl, reason) {
        window.parent.postMessage(
          {
            type: "hohonet_texture_status",
            status,
            hasTexture: !!hasTexture,
            imageUrl: imageUrl || null,
            reason: reason || null,
          },
          "*"
        );
      }

      function drawLayout(corners, imageUrl, options = {}) {
        meshObjects.forEach((object) => scene.remove(object));
        meshObjects = [];

        if (!corners || corners.length === 0) {
          updateStatus("没有可渲染的角点");
          updateControlState();
          return;
        }

        if (imageUrl && currentTexture && currentTextureUrl === imageUrl) {
          panoMaterial.uniforms.map.value = currentTexture;
          panoMaterial.needsUpdate = true;
          renderGeometry(corners, true, options);
          reportTextureStatus("loaded", true, imageUrl, "cached_texture_reused");
          return;
        }

        if (imageUrl) {
          reportTextureStatus("loading", false, imageUrl, "texture_load_requested");
          textureLoader.load(
            imageUrl,
            (texture) => {
              currentTexture = texture;
              currentTextureUrl = imageUrl;
              currentTexture.minFilter = THREE.LinearFilter;
              currentTexture.magFilter = THREE.LinearFilter;
              panoMaterial.uniforms.map.value = currentTexture;
              panoMaterial.needsUpdate = true;
              renderGeometry(corners, true, options);
              reportTextureStatus("loaded", true, imageUrl, "texture_load_succeeded");
            },
            undefined,
            () => {
              currentTexture = null;
              currentTextureUrl = null;
              updateStatus("纹理加载失败（可能是 CORS）");
              renderGeometry(corners, false, options);
              reportTextureStatus("failed", false, imageUrl, "texture_load_failed");
            }
          );
        } else {
          currentTexture = null;
          currentTextureUrl = null;
          renderGeometry(corners, false, options);
          reportTextureStatus("unavailable", false, null, "image_url_unavailable");
        }
      }

      function projectCornersForViewer(corners) {
        const ceilPoints = [];
        const floorPoints = [];
        const CAM_H = 1.6;
        corners.forEach((corner) => {
          const u = (corner.x / W) * 2 * Math.PI - Math.PI;
          const vFloor = (corner.y_floor / H - 0.5) * Math.PI;
          const vCeil = (corner.y_ceiling / H - 0.5) * Math.PI;
          const safeFloor = Math.max(0.01, Math.min(1.5, vFloor));
          const dist = CAM_H / Math.tan(safeFloor);
          const x = dist * Math.sin(u);
          const z = -dist * Math.cos(u);
          const safeCeil = Math.max(-1.5, Math.min(-0.01, vCeil));
          ceilPoints.push(new THREE.Vector3(x, -dist * Math.tan(safeCeil), z));
          floorPoints.push(new THREE.Vector3(x, -CAM_H, z));
        });
        return { ceilPoints, floorPoints, cameraHeight: CAM_H };
      }

      function renderGeometry(corners, hasTexture, options = {}) {
        meshObjects.forEach((object) => scene.remove(object));
        meshObjects = [];
        interactiveObjects = [];
        clearInspectionSelection();
        clearMeasurement();

        const preserveOrder = !!options.preserveOrder;
        const orderedCorners = preserveOrder
          ? cloneCorners(corners)
          : cloneCorners(corners).sort((a, b) => a.x - b.x);

        const projected = projectCornersForViewer(orderedCorners);
        const ceilPoints = projected.ceilPoints;
        const floorPoints = projected.floorPoints;
        const CAM_H = projected.cameraHeight;

        if (ceilPoints.length > 0) {
          ceilPoints.push(ceilPoints[0].clone());
          floorPoints.push(floorPoints[0].clone());
        }

        const inspectionTextureHidden =
          inspectionState.enabled && !inspectionState.displayOptions.texture;
        const textureDisplayed = hasTexture && !inspectionTextureHidden;
        const material = textureDisplayed
          ? panoMaterial
          : new THREE.MeshBasicMaterial({
              color: inspectionTextureHidden ? 0x374151 : 0xcccccc,
              wireframe: !inspectionTextureHidden,
              transparent: true,
              opacity: inspectionTextureHidden ? 0.45 : 0.3,
              side: THREE.DoubleSide,
            });

        const wallGeo = new THREE.BufferGeometry();
        const wallVertices = [];
        for (let i = 0; i < ceilPoints.length - 1; i++) {
          const p1 = ceilPoints[i];
          const p2 = floorPoints[i];
          const p3 = ceilPoints[i + 1];
          const p4 = floorPoints[i + 1];

          wallVertices.push(p1.x, p1.y, p1.z);
          wallVertices.push(p2.x, p2.y, p2.z);
          wallVertices.push(p3.x, p3.y, p3.z);

          wallVertices.push(p2.x, p2.y, p2.z);
          wallVertices.push(p4.x, p4.y, p4.z);
          wallVertices.push(p3.x, p3.y, p3.z);
        }
        wallGeo.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(wallVertices, 3)
        );
        const wallMesh = new THREE.Mesh(wallGeo, material);
        scene.add(wallMesh);
        meshObjects.push(wallMesh);

        if (inspectionState.enabled) {
          for (let i = 0; i < ceilPoints.length - 1; i += 1) {
            const p1 = ceilPoints[i];
            const p2 = floorPoints[i];
            const p3 = ceilPoints[i + 1];
            const p4 = floorPoints[i + 1];
            const pickingGeometry = new THREE.BufferGeometry();
            pickingGeometry.setAttribute(
              "position",
              new THREE.Float32BufferAttribute([
                p1.x, p1.y, p1.z, p2.x, p2.y, p2.z, p3.x, p3.y, p3.z,
                p2.x, p2.y, p2.z, p4.x, p4.y, p4.z, p3.x, p3.y, p3.z,
              ], 3)
            );
            const pickingMaterial = new THREE.MeshBasicMaterial({
              transparent: true,
              opacity: 0,
              side: THREE.DoubleSide,
              depthWrite: false,
            });
            pickingMaterial.colorWrite = false;
            const pickingMesh = new THREE.Mesh(pickingGeometry, pickingMaterial);
            pickingMesh.userData.hohonetInspectionType = "wall";
            pickingMesh.userData.wallIndex = i + 1;
            scene.add(pickingMesh);
            meshObjects.push(pickingMesh);
            interactiveObjects.push(pickingMesh);
          }
        }

        const floorGeo = new THREE.BufferGeometry();
        const floorVertices = [];
        const floorCenter = new THREE.Vector3(0, -CAM_H, 0);
        for (let i = 0; i < floorPoints.length - 1; i++) {
          const p1 = floorPoints[i];
          const p2 = floorPoints[i + 1];
          floorVertices.push(floorCenter.x, floorCenter.y, floorCenter.z);
          floorVertices.push(p1.x, p1.y, p1.z);
          floorVertices.push(p2.x, p2.y, p2.z);
        }
        floorGeo.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(floorVertices, 3)
        );
        const floorMesh = new THREE.Mesh(floorGeo, material);
        scene.add(floorMesh);
        meshObjects.push(floorMesh);

        const lineMat = new THREE.LineBasicMaterial({
          color: 0x00ff00,
          depthTest: false,
        });
        const edges = [];
        for (let i = 0; i < ceilPoints.length - 1; i++) {
          edges.push(ceilPoints[i].x, ceilPoints[i].y, ceilPoints[i].z);
          edges.push(floorPoints[i].x, floorPoints[i].y, floorPoints[i].z);

          edges.push(ceilPoints[i].x, ceilPoints[i].y, ceilPoints[i].z);
          edges.push(ceilPoints[i + 1].x, ceilPoints[i + 1].y, ceilPoints[i + 1].z);

          edges.push(floorPoints[i].x, floorPoints[i].y, floorPoints[i].z);
          edges.push(
            floorPoints[i + 1].x,
            floorPoints[i + 1].y,
            floorPoints[i + 1].z
          );
        }
        const lineGeo = new THREE.BufferGeometry();
        lineGeo.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(edges, 3)
        );
        const lineMesh = new THREE.LineSegments(lineGeo, lineMat);
        scene.add(lineMesh);
        meshObjects.push(lineMesh);

        const changedPairSet = new Set(inspectionState.changedPairIndices);
        const changedWallSet = new Set(inspectionState.changedWallIndices);
        if (inspectionState.enabled && changedWallSet.size) {
          const changedWallEdges = [];
          for (let i = 0; i < orderedCorners.length; i += 1) {
            if (!changedWallSet.has(i + 1)) continue;
            const p1 = ceilPoints[i];
            const p2 = floorPoints[i];
            const p3 = ceilPoints[i + 1];
            const p4 = floorPoints[i + 1];
            for (const [a, b] of [[p1,p2], [p2,p4], [p4,p3], [p3,p1]]) {
              changedWallEdges.push(a.x,a.y,a.z,b.x,b.y,b.z);
            }
          }
          const changedWallGeometry = new THREE.BufferGeometry();
          changedWallGeometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(changedWallEdges, 3)
          );
          const changedWallLine = new THREE.LineSegments(
            changedWallGeometry,
            new THREE.LineDashedMaterial({
              color: 0xef4444, transparent: true, opacity: 0.95,
              dashSize: 0.12, gapSize: 0.08, depthTest: false,
            })
          );
          changedWallLine.computeLineDistances();
          changedWallLine.renderOrder = 46;
          scene.add(changedWallLine);
          meshObjects.push(changedWallLine);
        }

        const sphereGeo = new THREE.SphereGeometry(CORNER_RADIUS, 16, 16);
        const sphereMat = new THREE.MeshBasicMaterial({
          color: 0xffff00, transparent: true, opacity: CORNER_OPACITY,
        });
        [...ceilPoints.slice(0, orderedCorners.length), ...floorPoints.slice(0, orderedCorners.length)].forEach((point, pointIndex) => {
          const pairIndex = (pointIndex % orderedCorners.length) + 1;
          const changed = inspectionState.enabled && changedPairSet.has(pairIndex);
          const markerGeometry = changed
            ? new THREE.SphereGeometry(CHANGED_CORNER_RADIUS, 16, 16)
            : sphereGeo;
          const markerMaterial = inspectionState.enabled
            ? new THREE.MeshBasicMaterial({
                color: changed ? 0xff2d95 : 0x60a5fa,
                transparent: true,
                opacity: changed ? CHANGED_CORNER_OPACITY : CORNER_OPACITY,
              })
            : sphereMat;
          const sphere = new THREE.Mesh(markerGeometry, markerMaterial);
          sphere.position.copy(point);
          sphere.userData.hohonetCornerMarker = true;
          sphere.userData.hohonetBaseOpacity = changed
            ? CHANGED_CORNER_OPACITY
            : CORNER_OPACITY;
          sphere.userData.hohonetBaseColor = sphere.material.color.getHex();
          if (!cornerLabelsVisible) {
            sphere.material.opacity = HIDDEN_CORNER_OPACITY;
            sphere.material.color.setHex(HIDDEN_CORNER_COLOR);
          }
          if (inspectionState.enabled) {
            sphere.userData.hohonetInspectionType = "corner";
            sphere.userData.pairIndex = pairIndex;
            sphere.userData.endpoint = pointIndex < orderedCorners.length ? "ceiling" : "floor";
            interactiveObjects.push(sphere);
          }
          scene.add(sphere);
          meshObjects.push(sphere);
        });

        floorPoints.forEach((point, idx) => {
          if (idx >= orderedCorners.length) return;
          const sprite = makeTextSprite(String(idx + 1));
          sprite.position.copy(point).add(new THREE.Vector3(0, 0.5, 0));
          scene.add(sprite);
          meshObjects.push(sprite);
        });

        inspectionGeometry = { ceilPoints, floorPoints };
        if (
          inspectionState.enabled && inspectionState.displayOptions.ghost &&
          Array.isArray(inspectionState.ghostCorners) && inspectionState.ghostCorners.length
        ) {
          const ghost = projectCornersForViewer(inspectionState.ghostCorners);
          const ghostEdges = [];
          for (let i = 0; i < ghost.floorPoints.length; i += 1) {
            const next = (i + 1) % ghost.floorPoints.length;
            for (const [a, b] of [
              [ghost.ceilPoints[i], ghost.floorPoints[i]],
              [ghost.ceilPoints[i], ghost.ceilPoints[next]],
              [ghost.floorPoints[i], ghost.floorPoints[next]],
            ]) ghostEdges.push(a.x,a.y,a.z,b.x,b.y,b.z);
          }
          const ghostGeometry = new THREE.BufferGeometry();
          ghostGeometry.setAttribute("position", new THREE.Float32BufferAttribute(ghostEdges, 3));
          const ghostLine = new THREE.LineSegments(
            ghostGeometry,
            new THREE.LineDashedMaterial({ color:0xe5e7eb, transparent:true, opacity:0.45, dashSize:0.12, gapSize:0.08, depthTest:false })
          );
          ghostLine.computeLineDistances();
          ghostLine.renderOrder = 40;
          scene.add(ghostLine);
          meshObjects.push(ghostLine);
        }

        const hud = document.getElementById("inspection-hud");
        if (hud) {
          hud.style.display = inspectionState.enabled ? "block" : "none";
          if (inspectionState.enabled) hud.innerText = "Click a corner or wall.";
        }

        updateStatus(
          `已渲染 ${orderedCorners.length} 面墙（${textureDisplayed ? "带纹理" : "纯色"}）`
        );

        if (options.resetView) {
          camera.position.set(0, 8, 0);
          camera.lookAt(0, -CAM_H, 0);
          controls.target.set(0, -CAM_H, 0);
          controls.update();
        }
      }

      function inspectionHit(event) {
        if (!inspectionState.enabled || !interactiveObjects.length) return null;
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(interactiveObjects, false);
        if (!hits.length) return null;
        const nearest = hits[0];
        const nearbyCorner = hits.find(
          (hit) =>
            hit.object.userData.hohonetInspectionType === "corner" &&
            hit.distance <= nearest.distance + 0.2
        );
        return nearbyCorner || nearest;
      }

      function handleInspectionHit(hit, focus = false) {
        if (!hit) {
          clearInspectionSelection();
          postGeometrySelection({ type: "none" });
          return;
        }
        const kind = hit.object.userData.hohonetInspectionType;
        if (kind === "corner") {
          selectCorner(
            hit.object.userData.pairIndex,
            hit.object.userData.endpoint,
            hit.object.position
          );
        } else if (kind === "wall") {
          selectWall(Number(hit.object.userData.wallIndex));
        }
        if (focus) {
          focusInspectionPoint(hit.point);
        }
      }

      renderer.domElement.addEventListener("pointerdown", (event) => {
        if (!inspectionState.enabled) return;
        pointerDownPosition = { x: event.clientX, y: event.clientY };
      });
      renderer.domElement.addEventListener("pointerup", (event) => {
        if (!inspectionState.enabled || !pointerDownPosition) return;
        const moved = Math.hypot(
          event.clientX - pointerDownPosition.x,
          event.clientY - pointerDownPosition.y
        );
        pointerDownPosition = null;
        if (moved <= 4) handleInspectionHit(inspectionHit(event), false);
      });
      renderer.domElement.addEventListener("pointermove", (event) => {
        if (!inspectionState.enabled) return;
        renderer.domElement.style.cursor = inspectionHit(event) ? "pointer" : "grab";
      });
      renderer.domElement.addEventListener("dblclick", (event) => {
        if (inspectionState.enabled) handleInspectionHit(inspectionHit(event), true);
      });
      window.addEventListener("keydown", (event) => {
        if (inspectionState.enabled && event.key === "Escape") {
          clearInspectionSelection();
          clearMeasurement();
          postGeometrySelection({ type: "none" });
        }
      });

      function handleInspectionCommand(data) {
        if (!inspectionState.enabled) return;
        if (data.command === "set_measure_mode") {
          inspectionState.displayOptions.measureMode = !!data.enabled;
          clearMeasurement();
        } else if (data.command === "camera_preset") {
          applyCameraPreset(String(data.preset || "reset"));
        } else if (data.command === "select_issue") {
          selectIssue(data.issue);
        } else if (data.command === "clear_selection") {
          clearInspectionSelection();
          clearMeasurement();
        }
      }

      camera.position.set(0, 8, 0);
      controls.target.set(0, -1.6, 0);
      controls.update();

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      initializePanelCollapseState();
      initializePanelPosition();
      initializePanelDrag();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        const panel = document.getElementById("controls");
        if (panel) {
          const rect = panel.getBoundingClientRect();
          applyPanelPosition(rect.left, rect.top, false);
        }
      });

      function loadPreviewFromMessage(data) {
        if (data.width) W = data.width;
        if (data.height) H = data.height;

        inspectionState.enabled = data.inspectionMode === true;
        inspectionState.variantName = String(data.variantName || "");
        inspectionState.metadata = inspectionState.enabled && data.inspectionMetadata
          ? data.inspectionMetadata
          : null;
        inspectionState.ghostCorners = inspectionState.enabled && Array.isArray(data.ghostCorners)
          ? cloneCorners(data.ghostCorners)
          : null;
        inspectionState.changedPairIndices = inspectionState.enabled && Array.isArray(data.changedPairIndices)
          ? data.changedPairIndices.map(Number).filter(Number.isFinite)
          : [];
        inspectionState.changedWallIndices = inspectionState.enabled && Array.isArray(data.changedWallIndices)
          ? data.changedWallIndices.map(Number).filter(Number.isFinite)
          : [];
        inspectionState.displayOptions = {
          ghost: !!data.displayOptions?.ghost,
          measureMode: !!data.displayOptions?.measureMode,
          texture: data.displayOptions?.texture !== false,
        };
        if (!inspectionState.enabled) {
          clearInspectionSelection();
          clearMeasurement();
        }

        const baseCorners =
          Array.isArray(data.baseCorners) && data.baseCorners.length
            ? cloneCorners(data.baseCorners)
            : cloneCorners(data.corners || []);

        const identityOrder = getIdentityOrder(baseCorners.length);
        const normalized = normalizeOrder(data.previewOrder, baseCorners.length);
        applyPreviewStateSnapshot({
          baseCorners,
          currentOrder: normalized || identityOrder,
          savedOrder:
            data.previewOrderActive && normalized ? normalized.slice() : null,
          currentSignature: data.previewSignature || "",
          imageUrl: data.imageUrl || null,
          savedOverrideActive: !!data.previewOrderActive,
          selectedPairIndex: 0,
        });

        renderCurrentPreview(
          previewState.savedOverrideActive
            ? "已载入已保存顺序"
            : "已载入默认顺序",
          { resetView: true }
        );
      }

      try {
        const params = new URLSearchParams(window.location.search);
        const dataStr = params.get("data");
        const wStr = params.get("w");
        const hStr = params.get("h");

        if (wStr) W = parseInt(wStr, 10);
        if (hStr) H = parseInt(hStr, 10);

        if (dataStr) {
          const corners = JSON.parse(decodeURIComponent(dataStr));
          applyPreviewStateSnapshot({
            baseCorners: corners,
            currentOrder: getIdentityOrder(corners.length),
            savedOrder: null,
            currentSignature: "",
            imageUrl: null,
            savedOverrideActive: false,
            selectedPairIndex: 0,
          });
          renderCurrentPreview("已从 URL 载入", { resetView: true });
        } else {
          updateControlState();
        }

        const showAxesParam = params.get("show_axes");
        if (showAxesParam === "1" || showAxesParam === "true") {
          gridHelper.visible = true;
          axesHelper.visible = true;
        }
      } catch (error) {
        console.error("Error parsing URL data", error);
        updateStatus("数据解析失败");
      }

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || typeof data !== "object") return;

        if (data.type === "update_layout") {
          loadPreviewFromMessage(data);
          return;
        }

        if (data.type === "set_label_visibility") {
          setCornerLabelVisibility(data.visible);
          return;
        }

        if (data.type === "hohonet_inspection_command") {
          handleInspectionCommand(data);
          return;
        }

        if (data.type === "hohonet_preview_order_command") {
          handlePreviewOrderCommand(data);
          return;
        }

        if (data.type === "hohonet_preview_order_ack") {
          handlePreviewOrderAck(data);
        }
      });
      window.parent.postMessage(
        {
          type: "hohonet_viewer_ready",
          version: "m15.23.4",
          capabilities: {
            texture_status: true,
            geometry_selection: true,
            measurement: true,
            ghost: true,
            camera_presets: true,
          },
        },
        "*"
      );
    </script>
  </body>
</html>
